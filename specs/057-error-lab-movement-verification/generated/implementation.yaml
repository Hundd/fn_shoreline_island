- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: See short instruction and walk into bay with existing rifle.
    requires: []
    active_targets: []
    completion: Entry starts first faulty demonstration, no manual Start.
  - id: wrong_way
    zone: play_bay
    purpose: Start 0, goal 3; RIGHT [LEFT] RIGHT ends 1. Replace slot with RIGHT and
      verify 3.
    requires:
    - approach
    active_targets:
    - left
    - stop
    - right
    success_target: right
    completion: Run edited commands from start; actual endpoint 3 matches goal; credit
      index 0.
  - id: dock_return
    zone: play_bay
    purpose: Start 2, goal 1; [RIGHT] ends 3. Replace with LEFT and verify 1.
    requires:
    - wrong_way
    active_targets:
    - left
    - stop
    - right
    success_target: left
    completion: Run edited command from start; actual endpoint 1 matches goal; credit
      index 1.
  - id: overshoot
    zone: play_bay
    purpose: Start 1, goal 2; RIGHT [RIGHT] ends 3. Replace slot with STOP and verify
      2.
    requires:
    - dock_return
    active_targets:
    - left
    - stop
    - right
    success_target: stop
    completion: STOP executes zero-distance step; endpoint 2 matches goal; credit
      index 2.
  - id: finish
    zone: play_bay
    purpose: Hold 3/3, AI Detective Badge and debugging recap; Replay or Return.
    requires:
    - overshoot
    active_targets: []
    completion: Existing progress guard awards once; replay resets physical rounds,
      Return always available.
  connections:
  - from: arrival
    to: play_bay
    mode: walk
    width: 3
    points:
    - - 25
      - 35
      - 0
    - - 22
      - 35
      - 0
    - - 14
      - 27
      - 0
    gate: always
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
