devices:
- id: controller
  class: fn_shoreline_island_debug_station
  count: 1
  source: Existing debug_station; local movement confirmation/recovery adapter in
    plan.md required.
  settings:
    stage_starts:
    - 0
    - 2
    - 1
    stage_goals:
    - 3
    - 1
    - 2
    success_ids:
    - 2
    - 0
    - 1
    editable_slots_zero_based:
    - 1
    - 0
    - 1
    stage_commands:
    - RIGHT LEFT RIGHT
    - RIGHT
    - RIGHT RIGHT
    endpoint_verified: true
    automatic_entry: true
    solo_only: true
    quiet_rearm_seconds: 0.5
    movement_confirmation: TeleportTo true AND full3D Distance<=5cm for start and
      each step including STOP
