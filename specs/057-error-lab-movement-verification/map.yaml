stages:
- id: approach
  zone: arrival
  purpose: See short instruction and walk into bay with existing rifle.
  requires: []
  active_targets: []
  completion: Entry starts first faulty demonstration, no manual Start.
- id: wrong_way
  zone: play_bay
  purpose: Start 0, goal 3; RIGHT [LEFT] RIGHT ends 1. Replace slot with RIGHT and
    verify 3.
  requires:
  - approach
  active_targets:
  - left
  - stop
  - right
  success_target: right
  completion: Run edited commands from start; actual endpoint 3 matches goal; credit
    index 0.
- id: dock_return
  zone: play_bay
  purpose: Start 2, goal 1; [RIGHT] ends 3. Replace with LEFT and verify 1.
  requires:
  - wrong_way
  active_targets:
  - left
  - stop
  - right
  success_target: left
  completion: Run edited command from start; actual endpoint 1 matches goal; credit
    index 1.
- id: overshoot
  zone: play_bay
  purpose: Start 1, goal 2; RIGHT [RIGHT] ends 3. Replace slot with STOP and verify
    2.
  requires:
  - dock_return
  active_targets:
  - left
  - stop
  - right
  success_target: stop
  completion: STOP executes zero-distance step; endpoint 2 matches goal; credit index
    2.
- id: finish
  zone: play_bay
  purpose: Hold 3/3, AI Detective Badge and debugging recap; Replay or Return.
  requires:
  - overshoot
  active_targets: []
  completion: Existing progress guard awards once; replay resets physical rounds,
    Return always available.
assumptions:
- id: context
  detail: Accepted031 envelopes and markers are unchanged context; no placement commands.
    Measured Pix/track bind and fulltransform preserved.
  status: resolved
  evidence: evidence/live-baseline.json; plan.md
- id: adapter
  detail: Existing code discards movement failure. Local boolean movement confirmation,
    observation flags and recovery helper are required; Tool Lab confirms supported
    API precedent.
  status: resolved
  evidence: plan.md; current debug_station/event_station source
- id: stages
  detail: Stage parent refs measured; friendly inner values cannot be read through
    installed ObjectTools. Preserve source/defaults and all saved stage refs without
    writes.
  status: resolved
  evidence: evidence/live-baseline.json; spec.md
- id: review
  detail: User delegates agent/Producer review and forbids game/session/cook/push.
    Standard human-only ready gate remains honestly blocked, no fake approval. Runtime
    checks manual pending.
  status: resolved
  evidence: review.md; plan.md
