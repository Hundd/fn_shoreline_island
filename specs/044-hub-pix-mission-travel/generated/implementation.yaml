- step: bind_logic
  stages:
  - id: invite
    zone: guide
    purpose: Pix offers help choosing an independent learning activity.
    requires: []
    active_targets: []
    completion: Choose a mission opens list; Not now stays with input restored.
  - id: choice
    zone: guide
    purpose: Read all eight numbered lesson names and authoritative status; no mission-order
      prerequisite.
    requires:
    - invite
    active_targets: []
    completion: Selection opens named confirmation only; Cancel closes.
  - id: confirm
    zone: guide
    purpose: Deliberately confirm the desired lesson destination; wrong selection
      recoverable by Back.
    requires:
    - choice
    active_targets: []
    completion: Validate player/round/dialog/destination; invalidate UI then transport
      once.
  - id: arrival
    zone: campus
    purpose: Reach selected existing safe entrance; normal walk-in start and legitimate
      lesson actions preserved.
    requires:
    - confirm
    active_targets: []
    completion: Arrive without badge/attempt mutation; choose to walk into normal
      lesson and Return normally.
