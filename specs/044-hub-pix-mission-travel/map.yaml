stages:
- id: invite
  zone: guide
  purpose: Pix offers help choosing an independent learning activity.
  requires: []
  active_targets: []
  completion: Choose a mission opens list; Not now stays with input restored.
- id: choice
  zone: guide
  purpose: Read all eight numbered lesson names and authoritative status; no mission-order
    prerequisite.
  requires:
  - invite
  active_targets: []
  completion: Selection opens named confirmation only; Cancel closes.
- id: confirm
  zone: guide
  purpose: Deliberately confirm the desired lesson destination; wrong selection recoverable
    by Back.
  requires:
  - choice
  active_targets: []
  completion: Validate player/round/dialog/destination; invalidate UI then transport
    once.
- id: arrival
  zone: campus
  purpose: Reach selected existing safe entrance; normal walk-in start and legitimate
    lesson actions preserved.
  requires:
  - confirm
  active_targets: []
  completion: Arrive without badge/attempt mutation; choose to walk into normal lesson
    and Return normally.
assumptions:
- id: a01_geometry
  status: resolved
  detail: Selected guide/arrival positions measured with five ground/vertical rays
    each; candidate obstructions rejected. Native pawn capsule, facing, route readability
    remain implementation owner acceptance; don't infer those from rays.
  evidence: evidence/live-planning-survey.json; plan.md exact selected positions
- id: a02_guide
  status: resolved
  detail: Existing pix_hub_helper_figure native actor with full pose/bounds verified;
    reuse/move assembly, static figure plus text greeting. No new character asset
    dependency.
  evidence: evidence/live-planning-survey.json initial.pix
- id: a03_adapter
  status: resolved
  detail: Custom per-player travel adapter is explicit work in this approved proposal
    using existing canvas/button/journal APIs and native teleporters; portal pattern
    alone doesn't supply menus. Verify local focus/Back route during implementation,
    return to planning if unavailable.
  evidence: Content/fn_shoreline_island_academy_journal.verse show_panel; plan.md
    Modal specification
- id: a04_independence
  status: resolved
  detail: Remove Agent prior-badge checks from rescue/legacy/journal; preserve self-contained
    puzzle/reward gates. Existing count already queries real eight flags;8/8 guidance
    uses total and remains order-independent.
  evidence: Content/fn_shoreline_island_bot_station.verse rescue_monitor/agent_mission_ready;
    Content/fn_shoreline_island_academy_journal.verse module_restored/navigation_refresh
