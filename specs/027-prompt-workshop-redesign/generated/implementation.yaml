- step: bind_logic
  stages:
  - id: enter
    zone: arrival
    purpose: Arrive from hub
    requires: []
    active_targets: []
    completion: Entry records player and shows brief invitation.
  - id: inspect_scene
    zone: inspect
    purpose: Discover the specific request
    requires:
    - enter
    active_targets: []
    completion: Inspect reveals large blue and power reactor.
  - id: assemble
    zone: compose
    purpose: Set three editable slots
    requires:
    - inspect_scene
    active_targets: []
    completion: WHAT WHICH WHERE all selected; replacements remain possible.
  - id: test
    zone: compose
    purpose: Send and observe a concrete result
    requires:
    - assemble
    active_targets: []
    completion: Wrong request returns to editing with correct slots retained; correct
      request powers module.
  - id: delivered
    zone: connect
    purpose: Connect powered module
    requires:
    - test
    active_targets: []
    completion: Badge guarded and finale DATA awarded once for this run.
  connections:
  - from: arrival
    to: inspect
    mode: walk
    width: 3
    points:
    - - 15
      - 40
      - 0
    - - 20
      - 40
      - 0
    - - 27
      - 40
      - 0
