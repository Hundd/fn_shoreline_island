stages:
- id: enter
  zone: arrival
  purpose: Arrive from hub
  requires: []
  active_targets: []
  completion: Entry records player and shows brief invitation.
- id: inspect_scene
  zone: inspect
  purpose: Discover the specific request
  requires:
  - enter
  active_targets: []
  completion: Inspect reveals large blue and power reactor.
- id: assemble
  zone: compose
  purpose: Set three editable slots
  requires:
  - inspect_scene
  active_targets: []
  completion: WHAT WHICH WHERE all selected; replacements remain possible.
- id: test
  zone: compose
  purpose: Send and observe a concrete result
  requires:
  - assemble
  active_targets: []
  completion: Wrong request returns to editing with correct slots retained; correct request powers module.
- id: delivered
  zone: connect
  purpose: Connect powered module
  requires:
  - test
  active_targets: []
  completion: Badge guarded and finale DATA awarded once for this run.
assumptions:
- id: legacy_basis
  status: resolved
  detail: Feature-023 source contains editable buttons, per-player choices, prompt board, Send, wrong-result Pix
    motion, replay and one-time badge hook. The proposed one-request flow and DATA grants require scoped implementation;
    no claim of current support.
  evidence: Content/fn_shoreline_island_prompt_lab_controller.verse lines 30-139 and 298-648; specs/023-prompt-lab-data-core-rescue/evidence/controller-and-route-2026-09-24.md
- id: proposed_positions
  status: resolved
  detail: The four live floor tiles form an 88 x 28 m strip. Origin is the west/min-Y corner at floor top (2900,-600,2400)
    cm. New anchors are proposals above these tiles, not the old 66 x 62 m Prompt Lab platform.
  evidence: evidence/repair-footprint-2026-09-28.json; live bounds and transforms for repair_0_floor through repair_3_floor
- id: existing_asset_reuse
  status: resolved
  detail: The replacement area is the four repair stations. Preserve all four floors and garden_repair_walkway.
    Reconcile repair controls/boards/stage props and station subscriptions; shared hub, Garden, progress and return
    devices require dependency checks. Old Prompt Lab shooting actors are outside the area and are not an implicit
    removal set.
  evidence: User area correction; live repair inventory; Content/fn_shoreline_island_repair_station.verse and fn_shoreline_island_repair_progress.verse
- id: schematic_limits
  status: resolved
  detail: V1 blockout depicts successive activity zones, not three parallel choice slots, per-player state, animation
    paths or collision. These must be verified in implementation and cooked playtest.
  evidence: design/MAP_SPEC.md v1 limitations; spec.md AC-02 through AC-09
- id: repair_game_replacement
  status: resolved
  detail: Replace the old button-based repair game on repair_0_floor through repair_3_floor. Adapt suitable devices
    and remove obsolete activity actors/subscriptions; no old-game mode or parallel repair sequence remains. Keep
    the proposed workshop rewards and shared badge guard. The separate feature-026 shooting area is outside this
    replacement scope.
  evidence: 'User clarification 2026-09-28: the old game with buttons should be removed or adapted with a new one,
    no need to hold the old. See spec.md AC-11 and plan.md replacement decision.'
