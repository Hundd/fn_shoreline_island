- id: collision_policy
  detail: All new meshes decorative NoCollision; retained original floors/routes/supports
    and gameplay props supply original collision. Upper band is above player and target
    sightlines; player-height Neo conduit columns replace rendering of exact18 existing
    primitive posts; collision is retained. Runtime quality accepted for owner walkthrough,
    not proven.
  status: resolved
  evidence: scene-delta.json; evidence/before-hub.png; evidence/before-lab.png
- id: delegated_review
  detail: Owner explicitly delegates plan verification to Supervisor while unavailable,
    then builder, and requests skipping tests. Supervisor records actual delegated
    review authority and digest; no claim of personal owner digest review.
  status: resolved
  evidence: evidence/supervisor.md; current user instruction
- id: budget
  detail: Bounded pilot160 static meshes,4 shared existing Fortnite meshes,zero new
    lights/devices/textures. Cooked memory not measured because user skips tests;
    owner acceptance pending.
  status: resolved
  evidence: scene-delta.json; plan.md
