version: 1
map:
  id: hangar_launch_code
  title: Hangar Launch Code - revision 1
  theme: noncombat_launch_signal_test
  units: meters
  origin_cm:
  - 5400
  - -14300
  - 2314
  size:
  - 28
  - 14
  - 6
  learning_objective: Follow a visible instruction sequence in order; check and retry
    the current code when an input is wrong.
  source_feature: specs/035-hangar-launch-code/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- launch_bay
zones:
- id: arrival
  label: Walk in / out
  pattern: corridor
  position:
  - 0
  - 0
  - 0
  size:
  - 10
  - 14
  - 6
  purpose: Preserved west entrance; no locked exit.
  parameters:
    width_m: 3
    access: Always open west route, no gate or new wall
  devices: []
  overlap_with: []
  completion: Walk to Start Launch Test.
  reset: Entrance stays open.
- id: launch_bay
  label: 3 codes / 3 beacons
  pattern: shooting_gallery
  position:
  - 10
  - 0
  - 0
  size:
  - 18
  - 14
  - 6
  purpose: Three stable symbol pads, visible code strip, one beacon per completed
    code.
  parameters:
    target_count: 3
    friendly_fire: false
  devices:
  - controller
  - targets
  - blaster
  - board
  - hud
  - controls
  - control_labels
  - lights
  - finale
  - round_settings
  overlap_with: []
  completion: Enter A B C, then B A B C, then C A B A C. All beacons lit; Launch Ready.
  reset: Wrong shot restarts current code; completed beacons retained. Replay/cancel/exit/respawn/disconnect/round
    reset clear all local state.
