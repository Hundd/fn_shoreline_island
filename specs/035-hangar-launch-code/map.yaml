devices:
- id: controller
  class: fn_shoreline_island_launch_sequence
  count: 1
  source: New focused adapter explicitly scoped in plan.md; not currently implemented
  settings:
    codes:
    - A B C
    - B A B C
    - C A B A C
    quiet_interval_seconds: 0.5
    wrong_input: restart current code only
    owner: one active player; other players spectate
    bounds_world_cm:
    - 6400
    - 8200
    - -14300
    - -12900
    - 2264
    - 2914
- id: targets
  class: fn_shoreline_island_data_target
  count: 3
  source: Reuse current data_target source and existing ring/trigger assembly recipe;
    create dedicated instances
  settings:
    ids:
    - 0
    - 1
    - 2
    objective: false
    reward_value: 0
    face_size_m: 1.5
    stationary_y_facing: true
    stationary_positive_y: false
    supporting_devices: Each requires dedicated damage trigger, ring, label, VFX/audio
      and hidden objective references per live schema; included in three assemblies,
      not three actors total
- id: blaster
  class: fn_shoreline_island_data_blaster
  count: 1
  source: Existing live fn_shoreline_island_data_blaster; shared read-only dependency
  settings:
    reuse_only: true
    new_instances: 0
- id: board
  class: billboard_device
  count: 1
  source: New hangar_launch_code_board
  settings:
    text: code, checked slots, next cursor; maximum three short lines
- id: hud
  class: hud_message_device
  count: 1
  source: New dedicated owner HUD
  settings:
    recipient: active owner
    wrong_text: Order matters. Try this code again.
- id: controls
  class: button_device
  count: 2
  source: New hangar_launch_start and hangar_launch_cancel
  settings:
    instant: true
    owner_only_during_run: true
- id: control_labels
  class: billboard_device
  count: 2
  source: New Start/Cancel instruction signs
  settings:
    text:
    - START LAUNCH TEST / Shoot the code in order
    - CANCEL TEST / Or walk out any time
- id: lights
  class: customizable_light_device
  count: 3
  source: New POWER/LINK/READY beacons
  settings:
    start_on: false
    one_per_completed_code: true
- id: finale
  class: vfx_creator_device
  count: 1
  source: Existing native VFX device recipe, dedicated instance
  settings:
    duration_seconds: 1
    noncombat: true
- id: round_settings
  class: round_settings_device
  count: 1
  source: Existing shared round settings resolved by live bindings before implementation
  settings:
    reuse_only: true
    new_instances: 0
