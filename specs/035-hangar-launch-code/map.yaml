assumptions:
- id: measured_site
  detail: Axis-aligned 28 x 14 m envelope inside existing rotated prefab; preserve
    shell, stairs, toolbox and shelves.
  status: resolved
  evidence: evidence/planning-measurements.md; plan.md
- id: adapter
  detail: Existing gallery provides agent-attributed inputs and feedback. Ordered-code
    controller is explicitly required new implementation, not a claim of existing
    arbitrary pattern support.
  status: resolved
  evidence: plan.md; Content/fn_shoreline_island_data_target.verse; Content/fn_shoreline_island_pattern_line.verse
- id: stage_model
  detail: Map lists linear success path; spec R-03/R-06/R-07 defines retries and lifecycle.
    No branching route or target state-machine schema extension is implied.
  status: resolved
  evidence: spec.md AC-03..08
- id: reward_scope
  detail: Optional hangar test only; visible beacons and finale, no new progression
    dependency or Academy badge.
  status: resolved
  evidence: spec.md R-04/R-07
- id: physical_checks
  detail: Seven floor traces and three sight samples support anchors. Swept route
    collision, labels and native transforms remain explicit implementation acceptance
    checks.
  status: resolved
  evidence: evidence/planning-measurements.md; AC-01/09
- id: approval
  detail: This is an unapproved proposal; no approval.yaml created. Human review is
    next.
  status: resolved
  evidence: tasks.md P-04
