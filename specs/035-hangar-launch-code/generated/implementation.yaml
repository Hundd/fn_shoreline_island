- step: reconcile_device
  device:
    id: controller
    class: fn_shoreline_island_launch_sequence
    count: 1
    source: New focused adapter explicitly scoped in plan.md; not currently implemented
    settings:
      codes:
      - A B C
      - B A B C
      - C A B A C
      quiet_interval_seconds: 0.5
      wrong_input: restart current code only
      owner: one active player; other players spectate
      bounds_world_cm:
      - 6400
      - 8200
      - -14300
      - -12900
      - 2264
      - 2914
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: targets
    class: fn_shoreline_island_data_target
    count: 3
    source: Reuse current data_target source and existing ring/trigger assembly recipe;
      create dedicated instances
    settings:
      ids:
      - 0
      - 1
      - 2
      objective: false
      reward_value: 0
      face_size_m: 1.5
      stationary_y_facing: true
      stationary_positive_y: false
      supporting_devices: Each requires dedicated damage trigger, ring, label, VFX/audio
        and hidden objective references per live schema; included in three assemblies,
        not three actors total
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
