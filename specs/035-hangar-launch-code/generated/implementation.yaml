- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: Walk through existing west entrance
    requires: []
    active_targets: []
    completion: Reach Start control; exit stays open.
  - id: start
    zone: launch_bay
    purpose: Owner presses Start; visible code 1
    requires:
    - approach
    active_targets: []
    completion: Claim owner; reset lights and slots, arm pads.
  - id: code_1_slot_1
    zone: launch_bay
    purpose: 'Code 1, slot 1/3: A'
    requires:
    - start
    active_targets:
    - pad_0
    - pad_1
    - pad_2
    success_target: pad_0
    completion: Fill slot, require 0.5 seconds quiet; wrong input returns to this
      code slot 1.
  - id: code_1_slot_2
    zone: launch_bay
    purpose: 'Code 1, slot 2/3: B'
    requires:
    - code_1_slot_1
    active_targets:
    - pad_0
    - pad_1
    - pad_2
    success_target: pad_1
    completion: Fill slot, require 0.5 seconds quiet; wrong input returns to this
      code slot 1.
  - id: code_1_slot_3
    zone: launch_bay
    purpose: 'Code 1, slot 3/3: C'
    requires:
    - code_1_slot_2
    active_targets:
    - pad_0
    - pad_1
    - pad_2
    success_target: pad_2
    completion: Light beacon 1; hold 1 second. Show next code.
