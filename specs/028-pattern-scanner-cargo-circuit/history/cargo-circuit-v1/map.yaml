  - blaster
  - controller
  - boards
  - hud
  - cargo
  - controls
  - lights
  overlap_with: []
  completion: Shuttle verifies prediction, loads cargo and opens dispatch shutter.
  reset: Cancel motion and callbacks, park targets, restore homes. Preserve badges
    on replay; clear on round reset.
- id: dispatch
  label: Dispatch
  pattern: corridor
  position:
  - 76
  - 0
  - 0
  size:
  - 12
  - 25
  - 9
  purpose: Observe the same cargo dispatch, recap, replay or return.
  parameters:
    width_m: 3
    access: Always-open aisle plus existing hub teleporter via Return
  devices:
  - controller
  - progress
  - badge
  - controls
  - cargo
  - effects
  overlap_with: []
  completion: Award guarded Pattern Badge to eligible enrolled players; offer next
    run.
  reset: Cancel motion and callbacks, park targets, restore homes. Preserve badges
    on replay; clear on round reset.
