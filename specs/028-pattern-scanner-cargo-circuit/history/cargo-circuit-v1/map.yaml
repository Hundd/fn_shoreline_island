  reset: Cancel motion and callbacks, park targets, restore homes. Preserve badges
    on replay; clear on round reset.
- id: motion
  label: 3 Test motion
  pattern: shooting_gallery
  position:
  - 50
  - 0
  - 0
  size:
  - 26
  - 25
  - 9
  purpose: Observe shuttle 1 2 3 4 3 2 and shoot its next stop 1.
  parameters:
    target_count: 3
    friendly_fire: false
  devices:
