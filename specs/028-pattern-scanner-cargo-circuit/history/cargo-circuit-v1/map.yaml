    action: implement_after_approval
    shared_run: true
    enrollment_seconds: 5
    stage_success_ids:
    - 1
    - 6
    - 10
    - 12
    learning_rounds:
    - 0
    - 1
    - 1
    - 2
    cancel_on_empty: true
- id: entry
  class: mutator_zone_device
  count: 1
  source: Reuse suitable native zone or place locally after schema discovery
  settings:
    allow_weapon_fire: true
    enrollment: Only during five-second start window
- id: boards
  class: billboard_device
  count: 4
  source: Reconcile old loop boards
  settings:
    local_viewing_range: true
    hud_copy: true
- id: hud
  class: hud_message_device
  count: 1
  source: Reconcile old loop feedback
  settings:
