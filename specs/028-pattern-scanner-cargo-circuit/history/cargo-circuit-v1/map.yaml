  - -1100
  - 3000
  - 2400
  size:
  - 88
  - 25
  - 9
  learning_objective: Observe a repeating rule, repair an exception, then test a movement
    prediction.
  source_feature: specs\028-pattern-scanner-cargo-circuit\spec.md
