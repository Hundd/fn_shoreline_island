stages:
- id: enroll
  zone: arrival
  purpose: Enroll solo or team, display rule and controls
  requires: []
  active_targets: []
  completion: Start closes five-second join window; late arrivals spectate until next
    run.
- id: predict_next
  zone: predict
  purpose: Shoot B after ABABA
  requires:
  - enroll
  active_targets:
  - predict_0
  - predict_1
  - predict_2
  completion: Lock inputs; B fills gap; complete eligible player learning round 0.
  success_target: predict_1
- id: find_exception
  zone: repair
  purpose: Shoot fourth crate in A B A A A B
  requires:
  - predict_next
  active_targets:
  - slot_1
  - slot_2
  - slot_3
  - slot_4
  - slot_5
  - slot_6
  completion: Lift slot 4 into repair cradle; activate replacement choices after animation.
  success_target: slot_4
- id: repair_exception
  zone: repair
  purpose: Shoot B replacement
  requires:
  - find_exception
  active_targets:
  - replace_0
  - replace_1
  - replace_2
  completion: Lower corrected crate, animate ABABAB verification; complete learning
    round 1.
  success_target: replace_1
- id: predict_motion
  zone: motion
  purpose: Shoot next stop after 1 2 3 4 3 2
  requires:
  - repair_exception
  active_targets:
  - stop_1
  - stop_3
  - stop_4
  completion: Shuttle moves to 1, loads cargo; complete learning round 2 once.
  success_target: stop_1
- id: dispatch_complete
  zone: dispatch
  purpose: Watch repaired cargo ship; recap and return
  requires:
  - predict_motion
  active_targets: []
  completion: Guarded Pattern Badge, optional replay, always-available return; no
    new currency.
assumptions:
- id: measured_site
  status: resolved
  detail: Floor bounds measured live; all new markers and motion paths are proposed,
    not existing transforms.
  evidence: evidence/editor-inventory.json; four dock floors at top Z=2400 cm
- id: adapter_scope
  status: resolved
  detail: A scoped configured controller must be authored and verified during approved
    implementation. Existing shooting and synchronized motion APIs are implementation
    basis; no arbitrary current controller capability is claimed.
  evidence: Content/fn_shoreline_island_data_target.verse; Content/fn_shoreline_island_prompt_blaster.verse
    move_core; plan.md
- id: cooperative_design
  status: resolved
  detail: One shared team run deliberately replaces four independent stations. Start
    enrollment and spectator policy are explicit design choices for review.
  evidence: spec.md FR-06 and AC-05
- id: asset_qualification
  status: resolved
  detail: Catalog paths are discovered candidates. Implementation must check placeable
    eligibility, bounds and cook. Equivalent eligible Fortnite props may fill the
    same fixed envelopes; layout changes require renewed review.
  evidence: evidence/editor-inventory.json asset searches; asset-palette.md
- id: shared_dependencies
  status: resolved
  detail: Preserve field notes, promenade, four support floors, walkway and shared
    progress. Reconcile shed components individually before removal.
  evidence: evidence/editor-inventory.json site overlap; plan.md
- id: weapon_interpretation
  status: resolved
  detail: Use already deployed Pulse Rifle as Data Blaster; armor interpreted as weapon,
    no new wearable mechanic.
  evidence: spec.md scope decisions; feature 024 solo-recovery-2026-09-27.md
- id: schema_limits
  status: resolved
  detail: V1 depicts linear stages and target anchors. Motion, cooperative enrollment,
    native asset qualification, bullets and collision require implementation verification
    under the detailed plan.
  evidence: design/MAP_SPEC.md; plan.md motion contract; AC-01..10
