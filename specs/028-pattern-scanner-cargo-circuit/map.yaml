version: 1
map:
  id: pattern_scanner_solo
  title: Pattern Scanner - Solo Fill the Gap (revision 2)
  theme: clear_coastal_puzzle_bay
  units: meters
  origin_cm:
  - -1100
  - 3000
  - 2400
  size:
  - 88
  - 25
  - 9
  learning_objective: Recognize repeating groups, fill a missing member, and verify
    the completed pattern.
  source_feature: specs/028-pattern-scanner-cargo-circuit/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- play_bay
zones:
- id: arrival
  label: Walk in
  pattern: corridor
  position:
  - 0
  - 0
  - 0
  size:
  - 22
  - 6
  - 9
  purpose: Short hub approach; no Start button or countdown.
  parameters:
    width_m: 3
    access: Always open hub approach with a short direction sign; no lesson timer
  devices:
  - board
  - hud
  - controller
  overlap_with: []
  completion: Sole player enters play bay; first puzzle ready within 0.5 seconds.
  reset: Cancel generation and feedback; reset to puzzle 1 on departure/respawn. Replay
    preserves ordered progress and badge; round reset clears progress.
- id: play_bay
  label: All 3 rounds here
  pattern: shooting_gallery
  position:
  - 0
  - 6
  - 0
  size:
  - 22
  - 16
  - 9
  purpose: Solve three persistent strips using the same A/B/C answers; reward and
    replay here.
  parameters:
    target_count: 3
    friendly_fire: false
  devices:
  - controller
  - answers
  - blaster
  - board
  - hud
  - controls
  - progress
  - badge
  - lights
  - effect
  overlap_with: []
  completion: B, A, C fill the three gaps and award guarded Pattern Badge.
  reset: Cancel generation and feedback; reset to puzzle 1 on departure/respawn. Replay
    preserves ordered progress and badge; round reset clears progress.
connections:
- from: arrival
  to: play_bay
  mode: walk
  width: 3
  points:
  - - 6
