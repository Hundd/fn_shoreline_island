devices:
- id: controller
  class: configured_pattern_line_controller
  count: 1
  source: Existing Content/fn_shoreline_island_pattern_line.verse; scoped refactor
    required by plan.md
  settings:
    action: refactor_after_approval
    single_player_only: true
    auto_ready: true
    success_ids:
    - 1
    - 0
    - 2
    remove_team_enrollment: true
    remove_cargo_motion: true
    bounds_cm:
    - -1100
    - 1100
    - 3600
    - 5200
    - 2350
    - 3300
    detailed_delta: spec.md S-01..09 and plan.md; archive approval is stale
- id: answers
  class: fn_shoreline_island_data_target
  count: 3
  source: Reuse existing cargo_circuit target assemblies 0..2; remove 3..14 and uniquely
    owned components after reconciliation
  settings:
    stationary: true
    surface_size_m: 1.5
    labels:
    - A circle
    - B triangle
    - C square
    fixed_order: true
- id: blaster
  class: fn_shoreline_island_data_blaster
  count: 1
  source: Existing global Data Blaster and repaired spawner bindings
  settings:
    action: reuse_global
    duplicate_granter: false
- id: board
  class: billboard_device
  count: 1
  source: Reuse one existing board; remove three old boards
  settings:
    persistent_six_slot_strip: true
    action_text: SHOOT THE MISSING SYMBOL
    max_size_m:
    - 10
    - 2
    no_shootable_examples: true
- id: hud
  class: hud_message_device
  count: 1
  source: Reuse cargo_circuit_feedback
  settings:
    audience: sole active player
    automatic_hints: true
- id: controls
  class: button_device
  count: 2
  source: Reuse existing Replay and entry Return; remove other nine buttons
  settings:
    roles:
    - Replay after completion
    - Return anytime
- id: progress
  class: fn_shoreline_island_loop_progress
  count: 1
  source: Retain existing loop_progress identity and journal/finale references
  settings:
    ordered_indices:
    - 0
    - 1
    - 2
    badge_once_per_round: true
- id: badge
  class: tracker_device
  count: 1
  source: Retain loop_badge_tracker
  settings:
    action: preserve_bindings
- id: lights
  class: customizable_light_device
  count: 3
  source: Reuse three round lights
  settings:
    one_per_round: true
    numeric_board_copy: true
- id: effect
  class: vfx_creator_device
  count: 1
  source: Reuse finale effect at pattern board
  settings:
    duration_seconds: 1
stages:
- id: approach
  zone: arrival
  purpose: Understand one instruction while approaching
  requires: []
  active_targets: []
  completion: Enter play bay; no timer or manual Start.
- id: pair
  zone: play_bay
  purpose: A B A B A ? -> B
  requires:
  - approach
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_1
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs.
- id: gap
  zone: play_bay
  purpose: A B ? B A B -> A
  requires:
  - pair
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_0
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs.
- id: triple
  zone: play_bay
  purpose: A B C A B ? -> C
  requires:
  - gap
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_2
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs.
- id: complete
  zone: play_bay
  purpose: Hold 3/3 badge result; Replay or Return
  requires:
  - triple
  active_targets: []
  completion: Badge once per round through existing progress; no dispatch walk or
    wait.
assumptions:
- id: site
  detail: Measured 88 x 25 m dock retained; proposed 22 x 22 m approach/play footprint
    uses first tile. Remaining tiles are safe open dock, not additional puzzle stations.
  status: resolved
  evidence: evidence/editor-inventory.json; plan.md layout
- id: solo_scope
  detail: User explicitly requested singleplay. Remove team mechanics from this activity;
    preserve other missions and island matchmaking configuration.
  status: resolved
  evidence: 'User message 2026-09-29: and also do only singleplay; spec.md S-05'
- id: adapter
  detail: Existing controller is hardcoded for v1. Approved implementation must refactor
    it for three stationary targets and solo auto-ready; existing target/progress
    APIs are reusable, new behavior is not claimed as shipped.
  status: resolved
  evidence: Content/fn_shoreline_island_pattern_line.verse; plan.md implementation
    steps
- id: cleanup
  detail: Remove all 21 conveyor bodies and obsolete cargo stations through exact
    actor/dependency reconciliation; retain shared structural/routes/progress actors.
  status: resolved
  evidence: evidence/simplification-live-inventory-2026-09-29.json; spec.md S-07/08
- id: lesson_change
  detail: Replace movement prediction and exception hunting with three consistent
    gap-filling rounds; this is a material design change requiring new approval.
  status: resolved
  evidence: spec.md S-03 and scope
- id: physical_verification
  detail: Positions are design anchors, not verified collision/FOV. Final rotations,
    pivots and native bounds are measured during implementation; cooked solo tests
    gate acceptance.
  status: resolved
  evidence: plan.md; spec.md SA-01..09
- id: approval
  detail: Root approval.yaml remains the historical v1 approval; it cannot authorize
    the revised digest. No new approval has been created.
  status: resolved
  evidence: history/cargo-circuit-v1/; tasks.md R2-T03
