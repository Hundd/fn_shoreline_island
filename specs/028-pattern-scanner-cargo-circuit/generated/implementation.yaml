      action: refactor_after_approval
      single_player_only: true
      auto_ready: true
      success_ids:
      - 1
      - 0
      - 2
      remove_team_enrollment: true
      remove_cargo_motion: true
      bounds_cm:
      - -1100
      - 1100
      - 3600
      - 5200
      - 2350
      - 3300
