- step: bind_logic
  stages:
  - id: enroll
    zone: arrival
    purpose: Enroll solo or team, display rule and controls
    requires: []
    active_targets: []
    completion: Start closes five-second join window; late arrivals spectate until
      next run.
  - id: predict_next
    zone: predict
    purpose: Shoot B after ABABA
    requires:
    - enroll
    active_targets:
    - predict_0
    - predict_1
    - predict_2
    completion: Lock inputs; B fills gap; complete eligible player learning round
      0.
    success_target: predict_1
  - id: find_exception
    zone: repair
    purpose: Shoot fourth crate in A B A A A B
    requires:
    - predict_next
    active_targets:
    - slot_1
    - slot_2
    - slot_3
    - slot_4
    - slot_5
    - slot_6
    completion: Lift slot 4 into repair cradle; activate replacement choices after
      animation.
    success_target: slot_4
  - id: repair_exception
    zone: repair
    purpose: Shoot B replacement
    requires:
    - find_exception
    active_targets:
    - replace_0
    - replace_1
    - replace_2
    completion: Lower corrected crate, animate ABABAB verification; complete learning
      round 1.
    success_target: replace_1
  - id: predict_motion
    zone: motion
    purpose: Shoot next stop after 1 2 3 4 3 2
    requires:
    - repair_exception
    active_targets:
    - stop_1
    - stop_3
    - stop_4
    completion: Shuttle moves to 1, loads cargo; complete learning round 2 once.
    success_target: stop_1
  - id: dispatch_complete
    zone: dispatch
    purpose: Watch repaired cargo ship; recap and return
    requires:
    - predict_motion
    active_targets: []
    completion: Guarded Pattern Badge, optional replay, always-available return; no
      new currency.
