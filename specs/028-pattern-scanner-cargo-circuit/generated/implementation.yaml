- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: Understand one instruction while approaching
    requires: []
    active_targets: []
    completion: Enter play bay; no timer or manual Start.
  - id: pair
    zone: play_bay
    purpose: A B A B A ? -> B
    requires:
    - approach
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_1
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs.
  - id: gap
    zone: play_bay
    purpose: A B ? B A B -> A
    requires:
    - pair
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_0
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs.
  - id: triple
    zone: play_bay
    purpose: A B C A B ? -> C
    requires:
    - gap
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_2
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs.
  - id: complete
    zone: play_bay
    purpose: Hold 3/3 badge result; Replay or Return
    requires:
    - triple
    active_targets: []
    completion: Badge once per round through existing progress; no dispatch walk or
      wait.
  connections:
  - from: arrival
    to: play_bay
    mode: walk
    width: 3
    points:
    - - 6
      - 4
      - 0
    - - 6
      - 6
      - 0
    - - 10
      - 9
      - 0
    gate: always
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
