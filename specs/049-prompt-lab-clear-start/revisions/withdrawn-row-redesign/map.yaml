stages:
- id: enter
  zone: arrival
  purpose: Enroll player with existing loadout
  requires: []
  active_targets: []
  completion: Ready grounded entry or explicit Start enrolls; no invisible movement
    requirement
- id: intro
  zone: knowledge
  purpose: One-second welcome, four-second lesson; persistent request stays readable
  requires:
  - enter
  active_targets: []
  completion: Choices activate by6s from ready entry
- id: color
  zone: arena
  purpose: Choose WHAT using color
  requires:
  - intro
  active_targets:
  - blue
  - red
  - green
  success_target: blue
  completion: BLUE hit advances; wrong hits retry
- id: detail
  zone: arena
  purpose: Resolve ambiguity by adding LARGE
  requires:
  - color
  active_targets:
  - large_detail
  success_target: large_detail
  completion: LARGE objective hit advances
- id: select_large
  zone: arena
  purpose: Apply the useful detail
  requires:
  - detail
  active_targets:
  - red
  - small_blue
  - large_blue
  success_target: large_blue
  completion: LARGE BLUE hit then two-second instruction handoff
- id: acquire
  zone: arena
  purpose: Acquire the slowly moving core
  requires:
  - select_large
  active_targets:
  - large_blue
  success_target: large_blue
  completion: Hit freezes both core and hit surface
- id: destination
  zone: arena
  purpose: Choose WHERE the core belongs
  requires:
  - acquire
  active_targets:
  - reactor
  - scanner
  - storage
  success_target: reactor
  completion: REACTOR hit starts existing delivery
- id: finale
  zone: reward
  purpose: Watch result and earn Prompt Badge
  requires:
  - destination
  active_targets: []
  completion: Automatic delivery, same Prompt Badge and3 DATA; completion explanation
    and west return visible from firing area
assumptions:
- id: runtime_adapter
  status: resolved
  detail: Fixed sequence only; scoped improvements use existing controller and startup_ready,
    occupancy, generation and target hooks. Changes are explicitly proposed, not already
    supported YAML configuration.
  evidence: Current Content/fn_shoreline_island_prompt_blaster.verse and fn_shoreline_island_data_target.verse;
    plan.md code delta
- id: survey_and_runtime
  status: resolved
  detail: Native floor/zone/target anchors measured. Floating/partial zone is a hypothesis;
    exact FNE runtime overlap and sightlines are mandatory post-implementation acceptance,
    not proven by editor bounds.
  evidence: evidence/live-survey.json; user reports intermittent start and hidden
    targets; spec.md AC-01..04
- id: ownership_and_isolation
  status: resolved
  detail: Preserve shared devices and Prompt Workshop; only exact listed passive presentation
    objects retire. Conflicting references or additional obstructions require plan
    amendment before mutation.
  evidence: plan.md exact retirement scope and source audit
- id: verification_scope
  status: resolved
  detail: Cooked coverage, lifecycle, shared-state and first-time learning remain
    acceptance gates. No gameplay completion or historical approval is claimed.
  evidence: spec.md and tasks.md
- id: producer_scope_revision
  status: open
  detail: Owner questioned excessive redo; independent Producer withdrew this row
    redesign from approval review. Diagnose runtime failures and replace with a focused
    repair preserving unaffected layout, mission and timings before approval or implementation.
  evidence: docs/producer/prompt-lab-focused-improvement.md; user request to check
    with Producer, 2026-10-09
