    proposed_anchor_height_m: 2.2
    required_hit_coverage: Center and outer third from center/four corners standing/crouched,
      plus full moving sweep
    resolved_delta: plan.md coordinate delta; native wrappers resolved in implementation
      preflight
    machinery_height_policy: Retain measured floor Z; machine centers X53 at matching
      target Y
    shared_audio_policy: preserve shared hit/retry pair at current transforms
    moving_target_id: 5
    moving_offset_y_m: 2.5
    moving_leg_seconds: 4
