  settings:
    action: reuse
    purpose: Whole-platform grounded occupancy; automatic enrollment and departure
      lifecycle
    tiles:
    - 13
    - 13
    - 3
    native_actor_world_cm:
    - 9300
    - -5400
    - 2360
- id: controller
  class: fn_shoreline_island_prompt_blaster
  count: 1
  source: Content/fn_shoreline_island_prompt_blaster.verse
  settings:
    action: reuse
    configured: true
    targets:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    progress: progress
    data_energy: energy
    entry_zone: entry
    sequence_policy: Retain fixed [0,3,5,5,6]; scoped readiness, lifecycle and feedback
      changes in existing controller
    hints: Persistent evolving request and stage-specific mismatch explanations
    lifecycle: Reset only after actual full-platform last departure; restart cancels
      work and reenrolls current occupants
- id: targets
  class: fn_shoreline_island_data_target
  count: 9
