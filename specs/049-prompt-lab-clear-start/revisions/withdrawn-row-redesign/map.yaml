version: 1
map:
  id: prompt_lab_clear_start
  title: WITHDRAWN - Prompt Lab row redesign
  theme: ai_training
  units: meters
  origin_cm:
  - 6000
  - -8500
  - 2410
  size:
  - 66
  - 62
  - 15
  learning_objective: Help Pix choose WHAT, resolve WHICH ONE with useful details,
    then specify WHERE; see the result of an actionable request.
  source_feature: specs/049-prompt-lab-clear-start/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- knowledge
- arena
- reward
zones:
- id: arrival
  label: Entry
  pattern: corridor
  position:
  - 0
  - 0
  - 0
  size:
  - 14
  - 62
  - 15
  purpose: Grounded auto-entry with a clearly labelled Start/Restart control and always-open
    west exit.
  parameters:
    width_m: 3
    access: existing west ramp
  devices:
  - entry
  - blaster
  overlap_with: []
  completion: Automatic full-platform enrollment or explicit Start; idempotent after
    readiness.
  reset: Actual full-room departure removes participant; last participant departure
    resets.
- id: knowledge
  label: Pix hints
  pattern: knowledge_room
  position:
  - 14
  - 25
  - 0
  size:
  - 8
  - 12
  - 15
  purpose: Persistent request visible from the marked firing area; one-second welcome
    and four-second lesson.
  parameters:
    lesson: Useful details help Pix choose the right core and its destination.
    duration_seconds: 4
    hud_copy: true
  devices:
  - board
  - feedback
  - controller
  overlap_with:
  - arena
  - reward
  completion: Four-second lesson completes; current instruction persists.
  reset: Replay replays the lesson and cancels stale delayed events.
- id: arena
  label: Aim / Refine / Deliver
  pattern: target_sequence
  position:
  - 14
  - 0
  - 0
  size:
  - 52
  - 62
  - 15
  purpose: Five hits from a clear marked firing area; one row of visible answers with
    explanatory wrong-choice recovery.
  parameters:
    target_count: 9
    sequence:
    - 0
    - 3
    - 5
    - 5
    - 6
    shared_state: true
  devices:
  - controller
  - targets
  - hit_surfaces
  - energy
  - blaster
  overlap_with:
  - knowledge
  - reward
  completion: Five correct hits start the existing Pix delivery finale.
  reset: Restart cancels stale work and reenrolls occupants; full-room departure resets
    only when empty; retain earned DATA/badge.
- id: reward
  label: Finale
  pattern: reward_room
  position:
  - 14
  - 27
  - 0
  size:
  - 8
  - 6
  - 15
  purpose: Observe the distant delivery and receive badge/HUD where already standing;
    no walk required for reward.
  parameters:
    badge: Prompt Badge
    return_mode: walk west any time; existing rail optional only
  devices:
  - progress
  - replay
  - controller
  - return_rail
  overlap_with:
  - knowledge
  - arena
  completion: Automatic visible delivery and badge feedback at the firing area.
  reset: Replay preserves earned DATA and badge; cancel stale finale.
