- step: bind_logic
  stages:
  - id: enter
    zone: arrival
    purpose: Enroll player with existing loadout
    requires: []
    active_targets: []
    completion: Ready grounded entry or explicit Start enrolls; no invisible movement
      requirement
  - id: intro
    zone: knowledge
    purpose: One-second welcome, four-second lesson; persistent request stays readable
    requires:
    - enter
    active_targets: []
    completion: Choices activate by6s from ready entry
  - id: color
    zone: arena
    purpose: Choose WHAT using color
    requires:
    - intro
    active_targets:
    - blue
    - red
    - green
    success_target: blue
    completion: BLUE hit advances; wrong hits retry
  - id: detail
    zone: arena
    purpose: Resolve ambiguity by adding LARGE
    requires:
    - color
    active_targets:
    - large_detail
    success_target: large_detail
    completion: LARGE objective hit advances
  - id: select_large
    zone: arena
    purpose: Apply the useful detail
    requires:
    - detail
    active_targets:
    - red
    - small_blue
    - large_blue
    success_target: large_blue
    completion: LARGE BLUE hit then two-second instruction handoff
  - id: acquire
    zone: arena
    purpose: Acquire the slowly moving core
    requires:
    - select_large
    active_targets:
    - large_blue
    success_target: large_blue
    completion: Hit freezes both core and hit surface
  - id: destination
    zone: arena
    purpose: Choose WHERE the core belongs
    requires:
    - acquire
    active_targets:
    - reactor
    - scanner
    - storage
    success_target: reactor
    completion: REACTOR hit starts existing delivery
  - id: finale
    zone: reward
    purpose: Watch result and earn Prompt Badge
    requires:
    - destination
    active_targets: []
    completion: Automatic delivery, same Prompt Badge and3 DATA; completion explanation
      and west return visible from firing area
