version: 1
map:
  id: prompt_lab_focused_repair
  title: Prompt Lab - Grounded entry; existing target layout
  theme: ai_training
  units: meters
  origin_cm:
  - 6000
  - -8500
  - 2410
  size:
  - 66
  - 62
  - 15
  learning_objective: Choose WHAT, add WHICH ONE, then choose WHERE; useful details
    make a prompt actionable.
  source_feature: specs/049-prompt-lab-clear-start/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- knowledge
- arena
- reward
zones:
- id: arrival
  label: Approach / walk back
  pattern: corridor
  position:
  - 0
  - 30
  - 0
  size:
  - 20
  - 32
  - 15
  purpose: Existing west approach; lower only existing enrollment volume Z by 2.4m
    for grounded entry. Preserve XY and departure semantics.
  parameters:
    width_m: 3
    access: existing west ramp
  devices:
  - entry
  - blaster
  overlap_with: []
  completion: Existing entry volume enrolls the player.
  reset: Current source removes participation on entry-volume exit; last participant
    exit resets the room. Replay retains earned DATA and badge.
- id: knowledge
  label: Pix hints
  pattern: knowledge_room
  position:
  - 20
  - 34
  - 0
  size:
  - 14
  - 14
  - 15
  purpose: Read existing scripted Pix hints from the firing area; no walk to a board
    is required.
  parameters:
    lesson: A prompt tells AI what you want. Useful details help it choose.
    duration_seconds: 7
    hud_copy: true
  devices:
  - board
  - feedback
  - controller
  overlap_with:
  - arena
  completion: Seven-second knowledge phase completes.
  reset: Replay replays the lesson and cancels stale delayed events.
- id: arena
  label: Aim / Refine / Deliver
  pattern: target_sequence
  position:
  - 20
  - 30
  - 0
  size:
  - 35
  - 32
  - 15
  purpose: Five hits from the common firing area; blue, LARGE detail, large blue,
    moving acquisition, reactor.
  parameters:
    target_count: 9
    sequence:
    - 0
    - 3
    - 5
    - 5
    - 6
    shared_state: true
  devices:
  - controller
  - targets
  - hit_surfaces
  - energy
  - blaster
  overlap_with:
  - knowledge
  completion: Five correct hits start the existing Pix delivery finale.
  reset: Current source removes participation on entry-volume exit; last participant
    exit resets the room. Replay retains earned DATA and badge.
- id: reward
  label: Finale
  pattern: reward_room
  position:
  - 55
  - 0
  - 0
  size:
  - 11
  - 62
  - 15
  purpose: Distant finale spectacle; reward is automatic without walking here. Existing
    optional walk annotation is not a required reward route.
  parameters:
    badge: Prompt Badge
    return_mode: walk back via west approach; existing rail is optional and unverified
  devices:
  - progress
  - replay
  - controller
  - return_rail
  overlap_with: []
  completion: Finale completes and the existing badge guard awards eligible participants.
  reset: Replay preserves badge and DATA, resets spectacle and disables the return
    rail until completion.
