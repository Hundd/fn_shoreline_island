stages:
- id: enter
  zone: arrival
  purpose: Enroll player with existing loadout
  requires: []
  active_targets: []
  completion: Player enters existing volume
- id: intro
  zone: knowledge
  purpose: Existing 2s spectacle then 7s scripted AI Knowledge; board stays visible
    after timed HUD
  requires:
  - enter
  active_targets: []
  completion: Existing seven-second Knowledge phase finishes
- id: color
  zone: arena
  purpose: Choose WHAT using color
  requires:
  - intro
  active_targets:
  - blue
  - red
  - green
  success_target: blue
  completion: BLUE hit advances; wrong hits retry
- id: detail
  zone: arena
  purpose: Resolve ambiguity by adding LARGE
  requires:
  - color
  active_targets:
  - large_detail
  success_target: large_detail
  completion: LARGE objective hit advances
- id: select_large
  zone: arena
  purpose: Apply the useful detail
  requires:
  - detail
  active_targets:
  - red
  - small_blue
  - large_blue
  success_target: large_blue
  completion: LARGE BLUE hit then two-second instruction handoff
- id: acquire
  zone: arena
  purpose: Acquire the slowly moving core
  requires:
  - select_large
  active_targets:
  - large_blue
  success_target: large_blue
  completion: Hit freezes both core and hit surface
- id: destination
  zone: arena
  purpose: Choose WHERE the core belongs
  requires:
  - acquire
  active_targets:
  - reactor
  - scanner
  - storage
  success_target: reactor
  completion: REACTOR hit starts existing delivery
- id: finale
  zone: reward
  purpose: Watch result and earn Prompt Badge
  requires:
  - destination
  active_targets: []
  completion: Existing Pix delivery and module spectacle; eligible participants get
    badge and 3 DATA; return rail enabled; walking exit stays open
assumptions:
- id: fixed_adapter
  status: resolved
  detail: Preserve current nine IDs and fixed [0,3,5,5,6] sequence, original 2s+7s
    intro, 2s moving-stage handoff, motion, Pix delivery, rewards and shared controller.
  evidence: Current Content/fn_shoreline_island_prompt_blaster.verse; evidence/live-survey.json
- id: withdrawn_redesign
  status: resolved
  detail: Earlier all-target row redesign is withdrawn, archived and excluded from
    this revision.
  evidence: docs/producer/prompt-lab-focused-improvement.md; revisions/withdrawn-row-redesign/README.md
- id: start_cause
  status: resolved
  detail: QA twice reproduced jump-only optional enrollment with landing exit/reset.
    Native generated overlap mesh localZ0..384, component location0/scale6,12,3 confirms
    lower2600, upper3752 versus floor2410. Propose only Z2360; retain XY/tiles/source.
    Grounded post-fix trials remain acceptance, not prior proof.
  evidence: evidence/diagnostic-qa.md; evidence/live-survey.json; evidence/proposed-entry-delta.json;
    plan.md
- id: start_only_scope
  status: resolved
  detail: Revision3 approves only the one actor Z repair. Hidden-target/visual overlap
    feedback remains an explicit deferred investigation, excluded from this delta.
    No target transforms, source, cues or decoration change.
  evidence: spec.md FR-002 follow-up; tasks.md D01; current QA completed sequence
    but reports viewpoint-dependent overlap near Replay and presentation offsets.
