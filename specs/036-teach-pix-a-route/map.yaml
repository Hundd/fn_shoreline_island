version: 1
map:
  id: teach_pix_a_route
  title: Teach Pix a Route - revision 1
  theme: hangar_robot_training_playground
  units: meters
  origin_cm:
  - 5400
  - -14400
  - 2314
  size:
  - 28
  - 16
  - 6
  learning_objective: Demonstrate a physical route, test a copying robot, and improve
    the example when the bay changes.
  source_feature: specs/036-teach-pix-a-route/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- playground
zones:
- id: arrival
  label: Walk in / out
  pattern: corridor
  position:
  - 0
  - 0
  - 0
  size:
  - 10
  - 16
  - 6
  purpose: Preserve west hangar entrance and exit.
  parameters:
    width_m: 3
    access: Always open west route; no new wall or gate
  devices: []
  overlap_with: []
  completion: Reach home pad; optional activity, no prerequisite.
  reset: Exit remains open.
- id: playground
  label: Walk / test / revise
  pattern: corridor
  position:
  - 10
  - 0
  - 0
  size:
  - 18
  - 16
  - 6
  purpose: Actual walked waypoints become the robot route; two deliveries with a changed
    bay.
  parameters:
    width_m: 3
    access: First demonstration in broad 6m practice strip; then full floor with two
      5m bypasses. Closure only blocks robot by explicit geometry, never exit.
  devices:
  - controller
  - robot
  - crate
  - pads
  - footprints
  - controls
  - control_labels
  - board
  - hud
  - lights
  - closure
  - outline
  - round_settings
  overlap_with: []
  completion: Two real robot-and-crate arrivals; old route tested and stopped at closure
    before revision.
  reset: Rerecord preserves delivery1; Cancel/Replay/departure/respawn/disconnect/round
    reset clears all local state and cancels stale playback.
connections:
- from: arrival
  to: playground
  mode: walk
  width: 3
  points:
  - - 2
    - 8
    - 0
  - - 10
    - 8
    - 0
  - - 12.5
    - 8
    - 0
  gate: always
markers:
