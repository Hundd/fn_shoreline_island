- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: Observe goal and seven-module gate
    requires: []
    active_targets: []
    completion: Eligible owner auto-starts; locked players get next-module guidance
      and Return
  - id: choose_cargo
    zone: dispatch
    purpose: Match cargo to real goal
    requires:
    - approach
    active_targets:
    - dispatch_a
    - dispatch_b
    - dispatch_c
    success_target: dispatch_b
    completion: Medical crate is selected visibly
  - id: launch_skill
    zone: dispatch
    purpose: Give Pix a reusable skill then follow its action
    requires:
    - choose_cargo
    active_targets:
    - dispatch_a
    - dispatch_b
    - dispatch_c
    success_target: dispatch_a
    completion: Pickup then Move to floor2; stop before changed gate and await owner
      arrival
  - id: observe_change
    zone: route_rescue
    purpose: Obtain evidence before changing a plan
    requires:
    - launch_skill
    active_targets:
    - rescue_a
    - rescue_b
    - rescue_c
    success_target: rescue_a
    completion: Scanner reveals Bridge blocked and Dock open
  - id: replan_route
    zone: route_rescue
    purpose: Adapt the same active delivery to new information
    requires:
    - observe_change
    active_targets:
    - rescue_a
    - rescue_b
    - rescue_c
    success_target: rescue_c
    completion: Resume via Dock detour; actual successful Drop at lab plus owner arrival
  - id: verify_result
    zone: delivery_check
    purpose: Check actual cargo identity and destination rather than agent claim
    requires:
    - replan_route
    active_targets:
    - check_a
    - check_b
    - check_c
    success_target: check_b
    completion: Fresh evidence choice plus actual Medical prop within 0.5m of lab;
      shared one-time badge and finale
  - id: finish
    zone: delivery_check
    purpose: Hold recap and allow Replay or Return
    requires:
    - verify_result
    active_targets: []
    completion: Target banks inactive and badge retained
  connections:
  - from: arrival
    to: dispatch
    mode: walk
    width: 3
    points:
    - - 98
