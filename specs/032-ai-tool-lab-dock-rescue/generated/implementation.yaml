- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: Walk in and see the goal
    requires: []
    active_targets: []
    completion: First request shown automatically.
  - id: scan_crate
    zone: tool_bay
    purpose: 'Unknown contents: Scanner observes; Speaker cannot invent; Light cannot
      scan.'
    requires:
    - approach
    active_targets:
    - scanner
    - speaker
    - light
    completion: Reveal labelled medical supplies; verify crate state then credit index
      0.
    success_target: scanner
  - id: notify_crew
    zone: tool_bay
    purpose: 'Known contents: Speaker shares the observed medical supplies.'
    requires:
    - scan_crate
    active_targets:
    - scanner
    - speaker
    - light
    completion: Pulse speaker, hold announcement caption and crew-ready check; verify
      then credit index 1.
    success_target: speaker
  - id: light_dock
    zone: tool_bay
    purpose: 'Dark dock: Light makes the delivery area bright.'
    requires:
    - notify_crew
    active_targets:
    - scanner
    - speaker
    - light
    completion: Lamp ON, pad lit, Pix reaches ready pose; verify then credit index
      2 and badge.
    success_target: light
  - id: finish
    zone: tool_bay
    purpose: Hold recap and offer Replay/Return.
    requires:
    - light_dock
    active_targets: []
    completion: Hide target assemblies; retain 3/3 and one-time badge.
  connections:
  - from: arrival
    to: tool_bay
    mode: walk
    width: 3
    points:
    - - 26
      - 29
      - 0
    - - 22
      - 29
      - 0
    - - 14
      - 29
      - 0
    gate: always
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
