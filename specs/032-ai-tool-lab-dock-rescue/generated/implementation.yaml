- step: reconcile_device
  device:
    id: controller
    class: fn_shoreline_island_event_station
    count: 1
    source: Retain station-1 controller; refactor opt-in solo flow, retire other three
      after audit
    settings:
      solo_only: true
      automatic_entry: true
      success_ids:
      - 0
      - 1
      - 2
      verified_outputs:
      - crate_scanned
      - crew_notified
      - dock_lit_and_pix_ready
      quiet_rearm_seconds: 0.5
      hint_seconds: 8
      configured_only_after_binding: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
