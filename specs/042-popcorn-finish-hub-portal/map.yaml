stages:
- id: teach_load
  zone: course
  purpose: 'One instruction performs one action: LOAD'
  requires: []
  active_targets:
  - target_0
  - target_1
  - target_2
  completion: Load accepted; retain prefix on wrong-order shot
  success_target: target_0
- id: teach_heat
  zone: course
  purpose: 'Instructions have an order: HEAT after LOAD'
  requires:
  - teach_load
  active_targets:
  - target_1
  - target_2
  completion: Heat accepted; retain prefix on wrong-order shot
  success_target: target_1
- id: teach_pop
  zone: course
  purpose: POP completes three steps and saves PopBridge on commit
  requires:
  - teach_heat
  active_targets:
  - target_2
  completion: PopBridge saved, first deck appears; actual first landing completes
    milestone0
  success_target: target_2
- id: first_reuse
  zone: course
  purpose: One invocation runs the saved three steps; actual landing checks result
  requires:
  - teach_pop
  active_targets:
  - target_3
  completion: Requires first landing; replay three instructions then reuse deck appears;
    landing completes milestone1
  success_target: target_3
- id: course_routes
  zone: course
  purpose: Same skill at another machine; either path valid; actual jumping checks
    built output
  requires:
  - first_reuse
  active_targets:
  - target_4
  - target_5
  - target_6
