- step: reconcile_device
  device:
    id: display
    class: creative_prop
    count: 6
    source: Qualified example props/core under asset-palette.md; raw catalog entries
      are candidates only.
    settings:
      roles:
      - burger
      - chair
      - car
      - banana
      - sofa
      - tractor
      visible_at_once: 1
      max_size_m:
      - 1.5
      - 1.5
      - 1.5
      shootable: false
      motion: none; switch example between decisions
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: bind_logic
  stages:
  - id: auto_ready
    zone: arrival
    purpose: Walk into solo bay with existing rifle; no waiting/claim.
    requires: []
    active_targets: []
    completion: Ready in 0.5 seconds; first decision begins.
  - id: label_burger
    zone: play_bay
    purpose: Burger is Food.
    requires:
    - auto_ready
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: food
    completion: Burger is Food. Feedback and quiet-hit guard before next decision.
  - id: label_chair
    zone: play_bay
    purpose: Chair is Furniture.
    requires:
    - label_burger
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: furniture
    completion: Chair is Furniture. Feedback and quiet-hit guard before next decision.
  - id: label_car
    zone: play_bay
    purpose: Car is Vehicle; section 0.
    requires:
    - label_chair
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: vehicle
    completion: Car is Vehicle; section 0. Feedback and quiet-hit guard before next
      decision.
  - id: fix_chair
    zone: play_bay
    purpose: Correct Pix Vehicle claim to Furniture; section 1.
    requires:
    - label_car
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: furniture
    completion: Correct Pix Vehicle claim to Furniture; section 1. Feedback and quiet-hit
      guard before next decision.
  - id: new_banana
    zone: play_bay
    purpose: New food example.
    requires:
    - fix_chair
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: food
    completion: New food example. Feedback and quiet-hit guard before next decision.
  - id: new_sofa
    zone: play_bay
    purpose: New furniture example.
    requires:
    - new_banana
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: furniture
    completion: New furniture example. Feedback and quiet-hit guard before next decision.
  - id: new_tractor
    zone: play_bay
    purpose: New vehicle example; section 2, guarded badge.
    requires:
    - new_sofa
    active_targets:
    - food
    - furniture
    - vehicle
    success_target: vehicle
    completion: New vehicle example; section 2, guarded badge. Feedback and quiet-hit
      guard before next decision.
  connections:
  - from: arrival
    to: play_bay
    mode: walk
    width: 3
    points:
    - - 109
      - 11
      - 0
    - - 100
      - 11
      - 0
    gate: always
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
