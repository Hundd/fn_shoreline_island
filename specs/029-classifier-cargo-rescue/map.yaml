stages:
- id: enroll
  zone: entry
  purpose: Start five-second enrollment and show short instructions
  requires: []
  active_targets: []
  completion: Close enrollment, begin LABEL.
- id: label_burger
  zone: label
  purpose: Burger is food
  requires:
  - enroll
  active_targets:
  - label_food
  - label_furniture
  - label_vehicle
  success_target: label_food
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Burger is food
- id: label_chair
  zone: label
  purpose: Chair is furniture
  requires:
  - label_burger
  active_targets:
  - label_food
  - label_furniture
  - label_vehicle
  success_target: label_furniture
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Chair is furniture
- id: label_car
  zone: label
  purpose: Car is a vehicle; section 0
  requires:
  - label_chair
  active_targets:
  - label_food
  - label_furniture
  - label_vehicle
  success_target: label_vehicle
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Car is a vehicle; section 0
- id: find_error
  zone: check
  purpose: Identify wrong high-confidence chair prediction
  requires:
  - label_car
  active_targets:
  - prediction_food
  - prediction_chair
  - prediction_car
  success_target: prediction_chair
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Identify wrong high-confidence chair prediction
- id: repair_label
  zone: check
  purpose: Correct chair and verify repeat pass; section 1
  requires:
  - find_error
  active_targets:
  - repair_food
  - repair_furniture
  - repair_vehicle
  success_target: repair_furniture
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Correct chair and verify repeat pass; section 1
- id: test_banana
  zone: test
  purpose: Classify unseen banana
  requires:
  - repair_label
  active_targets:
  - test_food
  - test_furniture
  - test_vehicle
  success_target: test_food
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Classify unseen banana
- id: test_sofa
  zone: test
  purpose: Classify unseen sofa
  requires:
  - test_banana
  active_targets:
  - test_food
  - test_furniture
  - test_vehicle
  success_target: test_furniture
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Classify unseen sofa
- id: test_tractor
  zone: test
  purpose: Classify unseen tractor
  requires:
  - test_sofa
  active_targets:
  - test_food
  - test_furniture
  - test_vehicle
  success_target: test_vehicle
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Classify unseen tractor
- id: dispatch
  zone: ship
  purpose: Ship tested cargo; section 2 and badge
  requires:
  - test_tractor
  active_targets:
  - ship_target
  success_target: ship_target
  completion: Lock inputs; animate result; 1.2-second feedback/rearm guard; advance
    once. Ship tested cargo; section 2 and badge
assumptions:
- id: measured_site
  detail: Floor dimensions measured live; proposed positions are not existing actor
    transforms.
  status: resolved
  evidence: evidence/editor-inventory.json
- id: adapter_scope
  detail: New scoped linear adapter and progress integration are explicitly implementation
    work; current station does not support shooting through configuration alone.
  status: resolved
  evidence: plan.md; Content/fn_shoreline_island_data_target.verse; Content/fn_shoreline_island_prompt_blaster.verse
- id: asset_qualification
  detail: Discovered meshes are candidates; qualify eligible placeable equivalents
    within fixed category and size envelopes before placement. No restricted assets
    assumed cookable.
  status: resolved
  evidence: asset-palette.md
- id: shared_dependencies
  detail: Preserve shared floors/progress/field notes/promenade; reconcile owned facade
    components individually.
  status: resolved
  evidence: plan.md; evidence/editor-inventory.json
- id: cooperative_policy
  detail: One enrolled team replaces four independent stations; late spectators join
    on replay.
  status: resolved
  evidence: spec.md FR-08
- id: weapon_interpretation
  detail: Use existing Pulse Rifle/Data Blaster; no new armor mechanic.
  status: resolved
  evidence: spec.md FR-02; feature 024 solo-recovery evidence
- id: schema_boundary
  detail: V1 anchors static targets and linear phases; continuous motion, rearm guard,
    collision and native eligibility require implementation verification.
  status: resolved
  evidence: plan.md motion contract and AC-01..10
