  parameters:
    width_m: 3
    access: existing west ramp
  devices:
  - entry
  - blaster
  overlap_with: []
  completion: Existing entry volume enrolls the player.
  reset: Walking out does not reset current source. Replay or last participant leaving the playspace resets.
- id: knowledge
  label: Pix hints
  pattern: knowledge_room
  position:
  - 20
  - 34
  - 0
  size:
  - 14
  - 14
  - 15
  purpose: Read existing scripted Pix hints from the firing area; no walk to a board is required.
  parameters:
    lesson: A prompt tells AI what you want. Useful details help it choose.
    duration_seconds: 7
    hud_copy: true
  devices:
  - board
  - feedback
  - controller
  overlap_with:
  - arena
  completion: Seven-second knowledge phase completes.
  reset: Replay replays the lesson and cancels stale delayed events.
- id: arena
  label: Aim / Refine / Deliver
  pattern: target_sequence
  position:
  - 20
  - 30
  - 0
  size:
  - 35
  - 32
  - 15
  purpose: Five hits from the common firing area; blue, LARGE detail, large blue, moving acquisition,
    reactor.
  parameters:
    target_count: 9
    sequence:
    - 0
    - 3
    - 5
    - 5
    - 6
    shared_state: true
  devices:
  - controller
  - targets
  - hit_surfaces
  - energy
  - blaster
  overlap_with:
  - knowledge
  completion: Five correct hits start the existing Pix delivery finale.
  reset: Replay cancels delayed work and resets the shared stage; last enrolled participant leaving the
    playspace resets. Walking out alone does not reset. Replay retains DATA and badge.
- id: reward
  label: Finale
  pattern: reward_room
  position:
  - 55
  - 0
  - 0
  size:
  - 11
  - 62
  - 15
  purpose: Preserve distant module spectacle and badge; walking return uses the same west approach. Rail
    boarding remains unverified.
  parameters:
    badge: Prompt Badge
    return_mode: walk back via west approach; existing rail is optional and unverified
  devices:
  - progress
  - replay
  - controller
  - return_rail
  overlap_with: []
  completion: Finale completes and the existing badge guard awards eligible participants.
  reset: Replay preserves badge and DATA, resets spectacle and disables the return rail until completion.
