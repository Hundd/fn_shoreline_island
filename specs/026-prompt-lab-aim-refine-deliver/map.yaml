stages:
- id: enter
  zone: arrival
  purpose: Enroll player with existing loadout
  requires: []
  active_targets: []
  completion: Player enters existing volume
- id: intro
  zone: knowledge
  purpose: Existing 2s spectacle then 7s scripted AI Knowledge; board stays visible after timed HUD
  requires:
  - enter
  active_targets: []
  completion: Existing seven-second Knowledge phase finishes
- id: color
  zone: arena
  purpose: Choose WHAT using color
  requires:
  - intro
  active_targets:
  - blue
  - red
  - green
  success_target: blue
  completion: BLUE hit advances; wrong hits retry
- id: detail
  zone: arena
  purpose: Resolve ambiguity by adding LARGE
  requires:
  - color
  active_targets:
  - large_detail
  success_target: large_detail
  completion: LARGE objective hit advances
- id: select_large
  zone: arena
  purpose: Apply the useful detail
  requires:
  - detail
  active_targets:
  - red
  - small_blue
  - large_blue
  success_target: large_blue
  completion: LARGE BLUE hit then two-second instruction handoff
- id: acquire
  zone: arena
  purpose: Acquire the slowly moving core
  requires:
  - select_large
  active_targets:
  - large_blue
  success_target: large_blue
  completion: Hit freezes both core and hit surface
- id: destination
  zone: arena
  purpose: Choose WHERE the core belongs
  requires:
  - acquire
  active_targets:
  - reactor
  - scanner
  - storage
  success_target: reactor
  completion: REACTOR hit starts existing delivery
- id: finale
  zone: reward
  purpose: Watch result and earn Prompt Badge
  requires:
  - destination
  active_targets: []
  completion: Existing Pix delivery and module spectacle; eligible participants get badge and 3 DATA;
    return rail enabled; walking exit stays open
assumptions:
- id: fixed_adapter
  status: resolved
  detail: Use only fixed [0,3,5,5,6] sequence and current authored hints; no new Verse, LLM, hint button,
    wave, timer or scoring rule.
  evidence: Content/fn_shoreline_island_prompt_blaster.verse; live configured=true and nine ordered targets
    in evidence/read-only-inspection.json
- id: design_review
  status: resolved
  detail: User approved the original layout and the surveyed floor-height correction. Target and board
    anchors remain unchanged; preserve floor-machine and reactor floor-effect Z while translating XY.
  evidence: User replies "implement spec 026, it is approved" and "Approve the floor-height correction";
    approval.yaml and evidence/approval-record.md
- id: assembly_survey
  status: resolved
  detail: Native wrappers, complete transforms, mesh hull and pulsed ring coverage surveyed; 87 exact
    full-transform operations prepared. Destination machine Z exception awaits design_review. Cooked
    visibility and outer-third hit acceptance remain post-implementation gates.
  evidence: evidence/implementation-preflight.json; evidence/clearance-survey.json;
    evidence/scenery-survey.json; evidence/resolved-delta.json; evidence/offset-correction.md
- id: approach_and_replay
  status: resolved
  detail: Entry native 6x12x3 Box settings, replay transform, raised scenery and floor/ramp join surveyed.
    Use west crossing near local Y40. Low pads retain ordinary walking steps. Reverse walking, actual
    volume enrollment, board readability and replay access remain cooked acceptance checks.
  evidence: evidence/offset-correction.md and native evidence/clearance-survey.json;
    evidence/implementation-preflight.json; evidence/scenery-survey.json
- id: lifecycle_scope
  status: resolved
  detail: Preserve shared replay and playspace-departure behavior. Walking out does not unsubscribe participants
    or auto-reset; replay does not clear participants. Late entrants do not receive a fresh full intro
    mid-stage.
  evidence: on_enter/on_leave/on_replay in current controller; no AgentExitsEvent subscription. Additional
    behavior requires separately reviewed code scope.
- id: verification_gate
  status: resolved
  detail: Future implementation must pass cooked solo/cooperative, hit coverage, reset, board readability
    and learning checks before acceptance. These are post-implementation tests, not evidence supplied
    by draft validation.
  evidence: spec.md acceptance scenarios and tasks.md; feature 024 acceptance remains partial
