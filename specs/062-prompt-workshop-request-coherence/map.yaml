    truthful partial correction and immediate rejection of unsupported RED+SMALL.
  parameters:
    choice_count: 6
    shared_state: false
  devices:
  - controller
  - choices
  - send
  - prompt_board
  - feedback
  - pix
  - cores
  - progress
  - energy
  - reactor_prop
  - scanner_prop
  - request_hud
  overlap_with: []
  completion: Five wrong supported combinations return to editable readiness with
    honest feedback; two RED+SMALL combinations reject before motion; correct request
    preserves values through Connect and completion.
  reset: Replay invalidates old attempt, restores props and temporary request; preserves
    earned DATA and shared badge. Boundary checks prevent stale continuations.
- id: connect
