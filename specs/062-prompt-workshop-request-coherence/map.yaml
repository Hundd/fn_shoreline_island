stages:
- id: enter
  zone: arrival
  purpose: Arrive from hub
  requires: []
  active_targets: []
  completion: Entry records player and shows brief invitation.
- id: inspect_scene
  zone: inspect
  purpose: Discover the specific request
  requires:
  - enter
  active_targets: []
  completion: Inspect reveals large blue and power reactor.
- id: assemble
  zone: compose
  purpose: Set three editable slots
  requires:
  - inspect_scene
  active_targets: []
  completion: Fill all three values. Edits allowed only before Send, after unsupported
    rejection or after a wrong demonstration fully returns.
- id: test
  zone: compose
  purpose: Send and observe a concrete result
  requires:
  - assemble
  active_targets: []
  completion: See spec feedback matrix and lifecycle policy; freeze submitted values
    across motion/result/return, retain success through Connect until Replay.
- id: delivered
  zone: connect
  purpose: Connect powered module
  requires:
  - test
  active_targets: []
  completion: Badge guarded and finale DATA awarded once for this run.
assumptions:
- id: zero_spatial_delta
  status: resolved
  detail: All envelopes, routes and marker coordinates are schematic flow annotations
    above a historically measured floor strip. Zero actor/layout/scale/property/binding
    delta. Preserve all existing transforms; no scene command may be derived from
    these annotations.
  evidence: '027 repair-footprint-2026-09-28.json: floor union x2900..11700 y-600..2200
    top z2400 cm; 027 map.yaml authored zones/anchors. No fresh editor access.'
- id: current_adapter
  status: resolved
  detail: prompt_workbench contract cites 023, but 027 fn_shoreline_island_prompt_workshop
    is the current concrete adapter with six choices, Send, three cores, Connect/Replay,
    DATA and shared badge. Do not instantiate 023 or treat choice_count as generic
    runtime configuration. Knowledge-room duration parameter is historical intent,
    not a new enforced timer.
  evidence: Current Content/fn_shoreline_island_prompt_workshop.verse and 027 workshop-bindings-and-retirement.json;
    plan.md adapter reconciliation.
- id: execution_boundary
  status: resolved
  detail: 'Source-only design, zero spatial delta. Mandatory preflight: restore live
    access and read back bindings/representation. Mandatory acceptance: build/validation/cooked
    QA. Token checks before run/moves and after suspensions with existing reset recovery;
    STOP and return to planning if canceled native MoveTo affects replacement. No
    unreviewed movement refactor. Resolved means boundary policy specified, NOT runtime
    verification.'
  evidence: plan.md cancellation strategy/stop condition; Scout report and evidence/supervisor.md.
    Current live access and gameplay acceptance remain unverified.
