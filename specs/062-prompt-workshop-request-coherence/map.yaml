devices:
- id: entry
  class: mutator_zone_device
  count: 1
  source: RECORDED 027 workshop-bindings-and-retirement.json plus current Content/fn_shoreline_island_prompt_workshop.verse;
    current native bindings must be read back before implementation. Reuse existing
    instance only.
  settings:
    action: PRESERVE existing instance, transform, native properties and bindings;
      no placement or device mutation authorized.
- id: controller
  class: fn_shoreline_island_prompt_workshop
  count: 1
  source: RECORDED 027 workshop-bindings-and-retirement.json plus current Content/fn_shoreline_island_prompt_workshop.verse;
    current native bindings must be read back before implementation. Reuse existing
    instance only.
  settings:
    action: PRESERVE existing instance, transform, native properties and bindings;
      no placement or device mutation authorized.
    source_delta: 'Only Content/fn_shoreline_island_prompt_workshop.verse: truthful
      feedback, frozen choices, phase guidance, RED+SMALL rejection and bounded cancellation
      safety.'
    adapter: Feature 027 Workshop; feature 023 pattern adapter is historical capability
      basis only.
    feedback_matrix:
    - '| BLUE / LARGE / R | Existing successful delivery: “The LARGE BLUE core powered
      the module. Press CONNECT.” |'
    - '| BLUE / LARGE / S | Demonstrate scanner. “Pix went to the SCANNER. Change
      WHERE to REACTOR; keep BLUE and LARGE.” |'
    - '| BLUE / SMALL / R | Demonstrate small blue at reactor. “Pix moved the SMALL
      BLUE core. Change WHICH to LARGE; keep BLUE and REACTOR.” |'
    - '| BLUE / SMALL / S | Demonstrate small blue at scanner. “Pix moved the SMALL
      BLUE core. Change WHICH to LARGE. Then check WHERE against the clue.” |'
    - '| RED / LARGE / R | Demonstrate red at reactor. “Pix moved a RED core. Change
      WHAT to BLUE; keep LARGE and REACTOR.” |'
    - '| RED / LARGE / S | Demonstrate red at scanner. “Pix moved a RED core. Change
      WHAT to BLUE. Then check WHERE against the clue.” |'
    - '| RED / SMALL / R | Reject before owner reservation/animation: “Pix cannot
      show a SMALL RED core here. Change WHAT to BLUE. Then check WHICH against the
      clue.” |'
    - '| RED / SMALL / S | Reject before owner reservation/animation: “Pix cannot
      show a SMALL RED core here. Change WHAT to BLUE. Then check WHICH and WHERE
      against the clue.” |'
    state_policy:
    - '| Before Inspect / incomplete / ready | Existing Inspect and incomplete checks;
      edits permitted | Existing next missing detail or Send |'
    - '| Fetch/carry | Reject selectors; Send rejected | “Watch Pix try this request.
      Wait before changing it.” |'
    - '| Wrong result hold / return | Reject selectors; Send rejected; show matrix
      correction | Correction plus “Pix is returning. Wait before changing it.” |'
    - '| Wrong ready | Edits permitted; new Send uses current values | Retained matrix
      correction, then “Change a detail, then SEND TO PIX.” |'
    - '| Correct delivery / return / delivered ready | Freeze values; Send does not
      restart; valid Connect permitted | “Walk east to CONNECT. Replay starts a new
      request.” |'
    - '| Connected, including remaining return | Freeze values; repeated Connect inert
      | “REPLAY or walk back west.” |'
    cancellation: Token checks before run/moves, after every suspension, between returns;
      existing reset recovery. STOP and return to planning if native cancellation
      interferes; no speculative refactor.
    success_policy: Connect during successful return; freeze values until Replay;
      DATA5+3 once/run, Replay preserves totals/next-run earning, shared badge unchanged.
    review_contract:
      spec.md: f7fa819c99a690ab95c394514cdba152537ea2fd9a50a3649e3a9d7b7359b2f4
      plan.md: 8951668038aa0394260a819755a2aaa15d654d2406835fa2b96963920201bb84
      tasks.md: 8d68107bd99b713e2b073d88c5e3dfe1b2cea816d85203fe13c88e2e4c8e629a
