devices:
- id: controller
  class: configured_pattern_line_controller
  count: 1
  source: Existing pattern_line; scoped selected-puzzle/owner adapter REQUIRED by
    plan.md. No scene edits.
  settings:
    action: local_source_adapter_after_delegated_review
    preserve_saved_original_arrays: true
    original_success_ids:
    - 1
    - 0
    - 2
    alternate_success_ids:
    - 2
    - 1
    - 0
    selection: Toggle only valid completed Replay; retain same owner; new round/disconnect/replacement
      owner original
    content: Exact six-field table in spec.md; all board/HUD/journal/answer consumers
      share selected record
    geometry: Preserve every actor transform and binding
- id: answers
  class: fn_shoreline_island_data_target
  count: 3
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    stationary: true
    surface_size_m: 1.5
    labels:
    - A circle
    - B triangle
    - C square
    fixed_order: true
- id: blaster
  class: fn_shoreline_island_data_blaster
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    duplicate_granter: false
- id: board
  class: billboard_device
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    persistent_six_slot_strip: true
    action_text: SHOOT THE MISSING SYMBOL
    max_size_m:
    - 10
    - 2
    no_shootable_examples: true
- id: hud
  class: hud_message_device
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    audience: sole active player
    automatic_hints: true
- id: controls
  class: button_device
  count: 2
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    roles:
    - Replay after completion
    - Return anytime
- id: progress
  class: fn_shoreline_island_loop_progress
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    ordered_indices:
    - 0
    - 1
    - 2
    badge_once_per_round: true
- id: badge
  class: tracker_device
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings: {}
- id: lights
  class: customizable_light_device
  count: 3
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    one_per_round: true
    numeric_board_copy: true
- id: effect
  class: vfx_creator_device
  count: 1
  source: Existing accepted028 identity; preserve unchanged. Current controller/native
    evidence in evidence/live-baseline.json.
  settings:
    duration_seconds: 1
stages:
- id: approach
  zone: arrival
  purpose: Understand one instruction while approaching
  requires: []
  active_targets: []
  completion: Enter play bay; no timer or manual Start. Original first-run stage shown;
    alternate substitutes C/B/A in the same stages. No additional walk or sequential
    stages.
- id: pair
  zone: play_bay
  purpose: A B A B A ? -> B
  requires:
  - approach
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_1
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs. Original first-run stage shown; alternate
    substitutes C/B/A in the same stages. No additional walk or sequential stages.
- id: gap
  zone: play_bay
  purpose: A B ? B A B -> A
  requires:
  - pair
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_0
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs. Original first-run stage shown; alternate
    substitutes C/B/A in the same stages. No additional walk or sequential stages.
- id: triple
  zone: play_bay
  purpose: A B C A B ? -> C
  requires:
  - gap
  active_targets:
  - answer_0
  - answer_1
  - answer_2
  success_target: answer_2
  completion: Fill gap immediately, confirm rule and light next progress indicator;
    credit ordered round. Same place and inputs. Original first-run stage shown; alternate
    substitutes C/B/A in the same stages. No additional walk or sequential stages.
- id: complete
  zone: play_bay
  purpose: Hold 3/3 badge result; Replay or Return
  requires:
  - triple
  active_targets: []
  completion: Badge once per round through existing progress; no dispatch walk or
    wait. Original first-run stage shown; alternate substitutes C/B/A in the same
    stages. No additional walk or sequential stages.
assumptions:
- id: context
  detail: Accepted028 envelopes/routes are context, not walls or new placements. Native
    target/board/control markers measured; no scene delta.
  status: resolved
  evidence: evidence/live-baseline.json; plan.md
- id: adapter
  detail: Current hardcoded controller lacks set selection. Bounded local adapter
    specified with inspected lifecycle and reusable target/progress APIs.
  status: resolved
  evidence: plan.md; current pattern_line source hash
- id: learning
  detail: Exact alternate table audited for intended periods1-3; engagement and readability
    remain manual, not established by static checks.
  status: resolved
  evidence: ../../docs/specialists/pattern-replay/learning-designer.md; spec.md
- id: review
  detail: User delegates agent/Producer review for this task; no fabricated human
    approval. Standard ready gate may remain human-approval blocked. No games/session/cook/push.
  status: resolved
  evidence: plan.md; review.md
