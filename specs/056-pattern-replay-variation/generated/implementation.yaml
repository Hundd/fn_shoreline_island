- step: bind_logic
  stages:
  - id: approach
    zone: arrival
    purpose: Understand one instruction while approaching
    requires: []
    active_targets: []
    completion: Enter play bay; no timer or manual Start. Original first-run stage
      shown; alternate substitutes C/B/A in the same stages. No additional walk or
      sequential stages.
  - id: pair
    zone: play_bay
    purpose: A B A B A ? -> B
    requires:
    - approach
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_1
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs. Original first-run stage shown;
      alternate substitutes C/B/A in the same stages. No additional walk or sequential
      stages.
  - id: gap
    zone: play_bay
    purpose: A B ? B A B -> A
    requires:
    - pair
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_0
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs. Original first-run stage shown;
      alternate substitutes C/B/A in the same stages. No additional walk or sequential
      stages.
  - id: triple
    zone: play_bay
    purpose: A B C A B ? -> C
    requires:
    - gap
    active_targets:
    - answer_0
    - answer_1
    - answer_2
    success_target: answer_2
    completion: Fill gap immediately, confirm rule and light next progress indicator;
      credit ordered round. Same place and inputs. Original first-run stage shown;
      alternate substitutes C/B/A in the same stages. No additional walk or sequential
      stages.
  - id: complete
    zone: play_bay
    purpose: Hold 3/3 badge result; Replay or Return
    requires:
    - triple
    active_targets: []
    completion: Badge once per round through existing progress; no dispatch walk or
      wait. Original first-run stage shown; alternate substitutes C/B/A in the same
      stages. No additional walk or sequential stages.
