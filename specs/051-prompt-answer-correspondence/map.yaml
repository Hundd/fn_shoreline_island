stages:
- id: enter
  zone: arrival
  purpose: Enroll player with existing loadout
  requires: []
  active_targets: []
  completion: Player enters existing volume
- id: intro
  zone: knowledge
  purpose: Existing 2s spectacle then 7s scripted AI Knowledge; board stays visible
    after timed HUD
  requires:
  - enter
  active_targets: []
  completion: Existing seven-second Knowledge phase finishes
- id: color
  zone: arena
  purpose: Choose WHAT using color
  requires:
  - intro
  active_targets:
  - blue
  - red
  - green
  success_target: blue
  completion: BLUE hit advances; wrong hits retry
- id: detail
  zone: arena
  purpose: Resolve ambiguity by adding LARGE
  requires:
  - color
  active_targets:
  - large_detail
  success_target: large_detail
  completion: LARGE objective hit advances
- id: select_large
  zone: arena
  purpose: Apply the useful detail
  requires:
  - detail
  active_targets:
  - red
  - small_blue
  - large_blue
  success_target: large_blue
  completion: LARGE BLUE hit then two-second instruction handoff
- id: acquire
  zone: arena
  purpose: Acquire the slowly moving core
  requires:
  - select_large
  active_targets:
  - large_blue
  success_target: large_blue
  completion: Hit freezes both core and hit surface
- id: destination
  zone: arena
  purpose: Choose WHERE the core belongs
  requires:
  - acquire
  active_targets:
  - reactor
  - scanner
  - storage
  success_target: reactor
  completion: REACTOR hit starts existing delivery
- id: finale
  zone: reward
  purpose: Watch result and earn Prompt Badge
  requires:
  - destination
  active_targets: []
  completion: Existing Pix delivery and module spectacle; eligible participants get
    badge and 3 DATA; return rail enabled; walking exit stays open
assumptions:
- id: native_feasibility
  status: resolved
  detail: Five actual controller-bound cores already have native bNoCollision=true.
    Align centers without changing policy; target4 is the sole changed hit anchor.
    No source change.
  evidence: evidence/planning-inspection.json; plan.md
- id: manual_runtime
  status: resolved
  detail: Static projections are limited evidence; owner explicitly assigns gameplay
    testing to manual acceptance. No game session, cooking or push.
  evidence: spec.md authorization and review.md; AC03/04 pending
