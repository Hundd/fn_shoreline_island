version: 1
map:
  id: ai_error_lab_solo
  title: AI Error Lab - Fix Pix's Route
  theme: compact_coastal_repair_range
  units: meters
  origin_cm:
  - -4600
  - -7800
  - 2400
  size:
  - 28
  - 37
  - 8
  learning_objective: Compare an AI plan's goal and actual result, correct one instruction,
    rerun and check the result.
  source_feature: specs/031-ai-error-lab-shoot-to-fix/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- play_bay
zones:
- id: arrival
  label: Existing walkway / walk in
  pattern: corridor
  position:
  - 24
  - 0
  - 0
  size:
  - 4
  - 37
  - 8
  purpose: Shared access strip; walk straight into bay without claim/start.
  parameters:
    width_m: 3
    access: Always open; preserve first-floor walkway and neighboring routes
  devices: []
  overlap_with: []
  completion: Sole local player enters bay; demonstration begins within 0.5 s.
  reset: Cancel generation, disable scoring, restore authored start and clear transient
    hints on leave, death/respawn, disconnect or round reset; replay/reentry starts
    round 1 while earned badge persists until manager round reset.
- id: play_bay
  label: Solo route repair bay
  pattern: shooting_gallery
  position:
  - 0
  - 0
  - 0
  size:
  - 24
  - 37
  - 8
  purpose: One fixed firing point, three stable corrections and a visible rerun on
    five tiles.
  parameters:
    target_count: 3
    friendly_fire: false
  devices:
  - controller
  - answers
  - blaster
  - entry
  - board
  - hud
  - controls
  - progress
  - tracker
  - hub
  - lights
  - pix
  - goal
  overlap_with: []
  completion: Three verified endpoint matches award retained badge once; replay/return
    nearby.
  reset: Cancel generation, disable scoring, restore authored start and clear transient
    hints on leave, death/respawn, disconnect or round reset; replay/reentry starts
    round 1 while earned badge persists until manager round reset.
