    development boundary
- id: a02_route_contract
  detail: v1 linear stages do not validate jump edges/equal receivers. Embedded course_contract
    must gain verified adapter validation before execution; no fake walk links.
  status: open
  evidence: design/MAP_SPEC.md; controller.settings.course_contract
- id: a03_entry_ramp
  detail: Proposed straight 11m long, 3m wide +X entry ramp from local3,8,0 to14,8,1.2
    joins starter west edge; 10.9 percent slope, inside primary bay.
  status: resolved
  evidence: controller/props settings exact geometry; footprint separate from Return
    annotation at5.3,13; actual accessibility requires cooked acceptance
