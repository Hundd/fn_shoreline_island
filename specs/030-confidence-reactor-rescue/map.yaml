devices:
- id: controller
  class: fn_shoreline_island_energy_station
  count: 1
  source: Refactor one existing controller after approval; old button modes cannot implement this
    through settings. plan.md
  settings:
    action: refactor_existing_and_retire_other_three
    solo_only: true
    auto_ready_seconds: 0.5
    bounds_local_m:
      min:
      - 84
      - 0
      - -0.5
      max:
      - 108
      - 35
      - 9
    success_ids:
    - 0
    - 1
    - 0
    - 2
    correct_feedback_seconds: 1.5
    quiet_hit_seconds: 0.5
    generation_cancel: true
    hint_after_mistakes:
    - 1
    - 2
    configuration_is_design_intent: true
- id: answers
  class: fn_shoreline_island_data_target
  count: 3
  source: Existing shared target/blaster primitives; reconcile three full assemblies, not three actors.
  settings:
    damage_only: true
    stationary: true
    face_size_m: 1.5
    face_toward: +Y
    labels:
    - A CHECK
    - B COOL
    - C RELEASE
    inactive_surfaces: disable and park
    ring_labels_and_optional_fx: audit full references before reuse
- id: blaster
  class: fn_shoreline_island_data_blaster
  count: 1
  source: Existing global Data Blaster and grant/respawn path; no duplicate spawner/granter.
  settings:
    action: reuse_global
    weapon: Pulse Rifle
- id: board
  class: billboard_device
  count: 1
  source: Reuse one old main board; target label boards belong to assemblies.
  settings:
    persistent_question: true
    result_and_hint: true
    max_size_m:
    - 7.5
    - 3.3
    object_name_or_readings: true
- id: hub_sign
  class: billboard_device
  count: 1
  source: Update existing hub direction sign in place; do not add another freestanding instruction
    station.
  settings:
    copy: 'Confidence Core: check before release'
- id: hud
  class: hud_message_device
  count: 1
  source: Reuse old mission feedback HUD.
  settings:
    audience: active solo player
    persistent_evidence_remains_on_board: true
- id: controls
  class: button_device
  count: 2
  source: Reuse two ordinary buttons after retiring old subscriptions.
  settings:
    roles:
    - Replay after completion
    - Return any time
    mount: existing vault1_control_mount rail; switch mesh bottom seated at top Z2513 cm
- id: progress
  class: fn_shoreline_island_energy_progress
  count: 1
  source: Existing energy_progress and inspected source; preserve identity.
  settings:
    action: preserve_identity
    commit: all three sections at final valid completion only
    api: set state.challenge then complete(player) per section, non-suspending guarded block
    indices:
    - 0
    - 1
    - 2
    badge_once_per_round: true
- id: badge
  class: tracker_device
  count: 1
  source: Existing energy_0_badge_tracker; keep journal/finale bindings.
  settings:
    action: preserve
- id: hub_return
  class: teleporter_device
  count: 1
  source: Existing shared hub destination; no replay teleporter.
  settings:
    action: reuse
- id: lights
  class: customizable_light_device
  count: 3
  source: Reuse eligible mission indicators.
  settings:
    milestones:
    - contradiction
    - fresh verification
    - release
    text_duplicates_color: true
- id: feedback_fx
  class: vfx_creator_device
  count: 1
  source: Reuse qualified feedback effect; optional target effects reconciled separately.
  settings:
    non_flashing: true
    max_duration_seconds: 1
    does_not_obscure_evidence: true
- id: audio
  class: audio_player_device
  count: 1
  source: Reuse mission action audio; feedback also visible.
  settings:
    optional_to_understand: true
- id: display
  class: creative_prop
  count: 1
  source: Qualified example props/core under asset-palette.md; raw catalog entries are candidates
    only.
  settings:
    roles:
    - static core
    visible_at_once: 1
    max_size_m:
    - 1.5
    - 1.5
    - 1.5
    shootable: false
    motion: none; cooling cue only
stages:
- id: auto_ready
  zone: arrival
  purpose: Walk into solo bay with existing rifle; no waiting/claim.
  requires: []
  active_targets: []
  completion: Ready in 0.5 seconds; first decision begins.
- id: check_claim
  zone: play_bay
  purpose: Inside HOT contradicts SAFE claim; section 0.
  requires:
  - auto_ready
  active_targets:
  - check
  - cool
  - release
  success_target: check
  completion: Inside HOT contradicts SAFE claim; section 0. Feedback and quiet-hit guard before next
    decision.
- id: cool_core
  zone: play_bay
  purpose: Cooling done; readings OLD/NOT RECHECKED, no evidence milestone.
  requires:
  - check_claim
  active_targets:
  - check
  - cool
  - release
  success_target: cool
  completion: Cooling done; readings OLD/NOT RECHECKED, no evidence milestone. Feedback and quiet-hit
    guard before next decision.
- id: check_change
  zone: play_bay
  purpose: Fresh outside/inside COOL; section 1.
  requires:
  - cool_core
  active_targets:
  - check
  - cool
  - release
  success_target: check
  completion: Fresh outside/inside COOL; section 1. Feedback and quiet-hit guard before next decision.
- id: release_core
  zone: play_bay
  purpose: Release only with fresh readings; section 2, guarded badge.
  requires:
  - check_change
  active_targets:
  - check
  - cool
  - release
  success_target: release
  completion: Release only with fresh readings; section 2, guarded badge. Keep final evidence
    and controls; hide target rings and labels after the 0.85 s hit cue until Replay/new run.
assumptions:
- id: site_basis
  status: resolved
  detail: Retain historical measured full site; use only valid first floor for gameplay. Proposed
    local anchors require live preflight.
  evidence: evidence/editor-inventory.json; plan.md site and layout
- id: solo_scope
  status: resolved
  detail: Carry user single-player simplification into these proposed revisions. No global matchmaking
    edits.
  evidence: Current user request to simplify 029/030 after solo 028 playtest; spec.md S-01/05
- id: adapter_boundary
  status: resolved
  detail: Scoped refactor explicitly part of proposed implementation, not configuration-only support.
    Reuse shooting_gallery and solo lifecycle basis; progress API differs from loop_progress.
  evidence: Inspected signal_station/energy_station and corresponding progress source; plan.md
- id: asset_qualification
  status: resolved
  detail: Qualified eligible equivalent allowed only for same recognizable role/category and 1.5
    m envelope. No suitable equivalent means stop and revise, not add a restricted asset.
  evidence: asset-palette.md; plan.md preflight
- id: preview_limits
  status: resolved
  detail: Blockout models target anchors and linear progression only. Perspective, glyphs, collision
    and enjoyment require cooked tests. No approval inferred.
  evidence: spec.md AC-01..09; review.md
- id: wallward_sightline
  status: resolved
  detail: Revision-3 layout uses measured wall, floor, board and target locations plus the player's
    eye-level screenshot. Planned vertical separation clears the center label on paper; cooked
    eye-level verification remains mandatory before closing AC-10.
  evidence: evidence/player-review-layout-2026-09-30.png; plan.md revision-3 layout; review.md
- id: floor_seam
  status: resolved
  detail: Retain debug-labeled support. Reconfirm and bridge only measured 48 cm seam; keep first-floor
    gameplay independent of seam.
  evidence: Historical floor measurements in evidence/editor-inventory.json; plan.md
