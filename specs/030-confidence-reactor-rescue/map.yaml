version: 1
map:
  id: confidence_solo
  title: Confidence Core - Check Before You Trust (revision 4 rail controls and finish)
  theme: clear_coastal_learning_bay
  units: meters
  origin_cm:
  - -13000
  - -4100
  - 2400
  size:
  - 112
  - 35
  - 9
  learning_objective: Check a confident claim with independent evidence and verify fresh results
    before acting.
  source_feature: specs/030-confidence-reactor-rescue/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- play_bay
zones:
- id: arrival
  label: Walk in
  pattern: corridor
  position:
  - 108
  - 0
  - 0
  size:
  - 4
  - 35
  - 9
  purpose: Existing hub approach and shared access; no enrollment or start control.
  parameters:
    width_m: 3
    access: Always open; first prompt starts on entry to play bay
  devices:
  - hub_sign
  overlap_with: []
  completion: Sole player enters play bay; ready within 0.5 seconds.
  reset: Cancel generation and clear physical run/readings on departure, death/respawn, disconnect
    or round reset. Reentry/replay starts first decision; earned badge retained until manager round
    reset.
- id: play_bay
  label: All decisions here
  pattern: shooting_gallery
  position:
  - 84
  - 0
  - 0
  size:
  - 24
  - 35
  - 9
  purpose: One fixed firing point, three answers, nearby replay/return and immediate visible evidence.
  parameters:
    target_count: 3
    friendly_fire: false
  devices:
  - controller
  - answers
  - blaster
  - board
  - hud
  - controls
  - progress
  - badge
  - hub_return
  - lights
  - feedback_fx
  - audio
  - display
  overlap_with: []
  completion: Complete all authored decisions and award existing badge once; after the final
    hit cue, hide all three action rings and labels until Replay or a new run.
  reset: Cancel generation and clear physical run/readings on departure, death/respawn, disconnect
    or round reset. Reentry/replay starts first decision; earned badge retained until manager round
    reset.
connections:
- from: arrival
  to: play_bay
  mode: walk
  width: 3
  points:
  - - 109
    - 26
    - 0
  - - 100
    - 20
    - 0
  gate: always
markers:
