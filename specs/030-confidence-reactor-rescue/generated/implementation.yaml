version: 1
map_id: confidence_solo
spec_digest: f803aa79bf44bf801009490168520a34fab1e274814127456ded8a89bfed9356
patterns_digest: 8a4742b9b975339573390959480b33480edb39fd6f38a5d601066fd1b71e8ea8
status: draft_requires_explicit_human_approval
executable: false
blockers: []
position_tolerance_m: 0.25
implementation:
- step: inspect_existing
  map: confidence_solo
  verify: Confirm project/world, actor identities, full transforms, bindings and checkpoint
    before mutations.
- step: reconcile_zone
  zone: arrival
  pattern: corridor
  policy: reuse_first; create or move only after an approved resolved delta
  position_cm:
  - -2200
  - -4100
  - 2400
  size_cm:
  - 400
  - 3500
  - 900
  parameters:
    width_m: 3
    access: Always open; first prompt starts on entry to play bay
  markers:
  - id: arrival
    kind: spawn
    zone: arrival
    label: Existing hub approach; no new spawn
    position:
    - 109
    - 26
    - 0
    source: Proposed revision-2 anchor on historically measured first floor; evidence/editor-inventory.json.
      Requires live reconciliation; not an existing actor transform.
  - id: inventory
    kind: weapon
    zone: arrival
    label: Existing rifle in inventory; no new granter
    position:
    - 110
    - 23
    - 1
    source: Proposed revision-2 anchor on historically measured first floor; evidence/editor-inventory.json.
      Requires live reconciliation; not an existing actor transform.
  verify: Compare envelope and marker positions; preserve full rotation/scale; save/readback.
- step: reconcile_zone
  zone: play_bay
  pattern: shooting_gallery
  policy: reuse_first; create or move only after an approved resolved delta
  position_cm:
  - -4600
  - -4100
  - 2400
  size_cm:
  - 2400
  - 3500
  - 900
  parameters:
    target_count: 3
    friendly_fire: false
  markers:
  - id: firing
    kind: checkpoint
    zone: play_bay
    label: Stand here for every decision; annotation only
    position:
    - 100
    - 20
    - 0
    source: Proposed revision-3 yellow-strip position based on player screenshot and
      live first-floor bounds; verify player eye view after cooked placement.
  - id: board
    kind: knowledge
    zone: play_bay
    label: Claim / readings / freshness / useful action
    position:
    - 100
    - 4
    - 7.2
    source: Proposed revision-3 board center 4 m from the back-wall plane, enlarged
      2x; live board was at world (-3000,-2300,2700) before relocation.
  - id: check
    kind: target
    zone: play_bay
    label: A CHECK - fixed
    position:
    - 97
    - 12
    - 1.8
    source: Proposed revision-3 row, 8 m ahead of yellow firing strip; live row was
      at world Y=-2100.
    target_id: 0
  - id: cool
    kind: target
    zone: play_bay
    label: B COOL - fixed
    position:
    - 100
    - 12
    - 1.8
    source: Proposed revision-3 row, 8 m ahead of yellow firing strip; live row was
      at world Y=-2100.
    target_id: 1
  - id: release
    kind: target
    zone: play_bay
    label: C RELEASE - fixed
    position:
    - 103
    - 12
    - 1.8
    source: Proposed revision-3 row, 8 m ahead of yellow firing strip; live row was
      at world Y=-2100.
    target_id: 2
  - id: display
    kind: knowledge
    zone: play_bay
    label: Static core; not a target
    position:
    - 105.5
    - 11
    - 1.6
    source: Proposed revision-3 core beside the wallward action row; relocate its
      support and finish FX together.
  - id: replay
    kind: checkpoint
    zone: play_bay
    label: Replay after finish; ordinary button
    position:
    - 103.8
    - 13.5
    - 1.36
    source: Revision-4 rail mount at world (-2620,-2750,2536); measured vault1_control_mount
      top Z2513 and switch mesh lower local extent 22.98 cm. User screenshot/request.
  - id: return
    kind: exit
    zone: play_bay
    label: Return any time; existing hub destination
    position:
    - 106.6
    - 13.5
    - 1.36
    source: Revision-4 rail mount at world (-2340,-2750,2536); 2.8 m from Replay,
      accessible beside the firing lane. User screenshot/request.
  - id: badge
    kind: reward
    zone: play_bay
    label: Existing Confidence Badge
    position:
    - 105
    - 4.5
    - 6
    source: Proposed revision-3 first progress-light annotation; vertical light stack
      sits to the right of the enlarged wallward board rather than covering its text.
  verify: Compare envelope and marker positions; preserve full rotation/scale; save/readback.
- step: reconcile_device
  device:
    id: controller
    class: fn_shoreline_island_energy_station
    count: 1
    source: Refactor one existing controller after approval; old button modes cannot
      implement this through settings. plan.md
    settings:
      action: refactor_existing_and_retire_other_three
      solo_only: true
      auto_ready_seconds: 0.5
      bounds_local_m:
        min:
        - 84
        - 0
        - -0.5
        max:
        - 108
        - 35
        - 9
      success_ids:
      - 0
      - 1
      - 0
      - 2
      correct_feedback_seconds: 1.5
      quiet_hit_seconds: 0.5
      generation_cancel: true
      hint_after_mistakes:
      - 1
      - 2
      configuration_is_design_intent: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: answers
    class: fn_shoreline_island_data_target
    count: 3
    source: Existing shared target/blaster primitives; reconcile three full assemblies,
      not three actors.
    settings:
      damage_only: true
      stationary: true
      face_size_m: 1.5
      face_toward: +Y
      labels:
      - A CHECK
      - B COOL
      - C RELEASE
      inactive_surfaces: disable and park
      ring_labels_and_optional_fx: audit full references before reuse
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: blaster
    class: fn_shoreline_island_data_blaster
    count: 1
    source: Existing global Data Blaster and grant/respawn path; no duplicate spawner/granter.
    settings:
      action: reuse_global
      weapon: Pulse Rifle
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: board
    class: billboard_device
    count: 1
    source: Reuse one old main board; target label boards belong to assemblies.
    settings:
      persistent_question: true
      result_and_hint: true
      max_size_m:
      - 7.5
      - 3.3
      object_name_or_readings: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: hub_sign
    class: billboard_device
    count: 1
    source: Update existing hub direction sign in place; do not add another freestanding
      instruction station.
    settings:
      copy: 'Confidence Core: check before release'
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: hud
    class: hud_message_device
    count: 1
    source: Reuse old mission feedback HUD.
    settings:
      audience: active solo player
      persistent_evidence_remains_on_board: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: controls
    class: button_device
    count: 2
    source: Reuse two ordinary buttons after retiring old subscriptions.
    settings:
      roles:
      - Replay after completion
      - Return any time
      mount: existing vault1_control_mount rail; switch mesh bottom seated at top
        Z2513 cm
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: progress
    class: fn_shoreline_island_energy_progress
    count: 1
    source: Existing energy_progress and inspected source; preserve identity.
    settings:
      action: preserve_identity
      commit: all three sections at final valid completion only
      api: set state.challenge then complete(player) per section, non-suspending guarded
        block
      indices:
      - 0
      - 1
      - 2
      badge_once_per_round: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: badge
    class: tracker_device
    count: 1
    source: Existing energy_0_badge_tracker; keep journal/finale bindings.
    settings:
      action: preserve
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: hub_return
    class: teleporter_device
    count: 1
    source: Existing shared hub destination; no replay teleporter.
    settings:
      action: reuse
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: lights
    class: customizable_light_device
    count: 3
    source: Reuse eligible mission indicators.
    settings:
      milestones:
      - contradiction
      - fresh verification
      - release
      text_duplicates_color: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: feedback_fx
    class: vfx_creator_device
    count: 1
    source: Reuse qualified feedback effect; optional target effects reconciled separately.
    settings:
      non_flashing: true
      max_duration_seconds: 1
      does_not_obscure_evidence: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: audio
    class: audio_player_device
    count: 1
    source: Reuse mission action audio; feedback also visible.
    settings:
      optional_to_understand: true
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: reconcile_device
  device:
    id: display
    class: creative_prop
    count: 1
    source: Qualified example props/core under asset-palette.md; raw catalog entries
      are candidates only.
    settings:
      roles:
      - static core
      visible_at_once: 1
      max_size_m:
      - 1.5
      - 1.5
      - 1.5
      shootable: false
      motion: none; cooling cue only
  verify: Discover class/editable schemas; resolve existing references; assert count/settings
    after any approved edit.
- step: bind_logic
  stages:
  - id: auto_ready
    zone: arrival
    purpose: Walk into solo bay with existing rifle; no waiting/claim.
    requires: []
    active_targets: []
    completion: Ready in 0.5 seconds; first decision begins.
  - id: check_claim
    zone: play_bay
    purpose: Inside HOT contradicts SAFE claim; section 0.
    requires:
    - auto_ready
    active_targets:
    - check
    - cool
    - release
    success_target: check
    completion: Inside HOT contradicts SAFE claim; section 0. Feedback and quiet-hit
      guard before next decision.
  - id: cool_core
    zone: play_bay
    purpose: Cooling done; readings OLD/NOT RECHECKED, no evidence milestone.
    requires:
    - check_claim
    active_targets:
    - check
    - cool
    - release
    success_target: cool
    completion: Cooling done; readings OLD/NOT RECHECKED, no evidence milestone. Feedback
      and quiet-hit guard before next decision.
  - id: check_change
    zone: play_bay
    purpose: Fresh outside/inside COOL; section 1.
    requires:
    - cool_core
    active_targets:
    - check
    - cool
    - release
    success_target: check
    completion: Fresh outside/inside COOL; section 1. Feedback and quiet-hit guard
      before next decision.
  - id: release_core
    zone: play_bay
    purpose: Release only with fresh readings; section 2, guarded badge.
    requires:
    - check_change
    active_targets:
    - check
    - cool
    - release
    success_target: release
    completion: Release only with fresh readings; section 2, guarded badge. Keep final
      evidence and controls; hide target rings and labels after the 0.85 s hit cue
      until Replay/new run.
  connections:
  - from: arrival
    to: play_bay
    mode: walk
    width: 3
    points:
    - - 109
      - 26
      - 0
    - - 100
      - 20
      - 0
    gate: always
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
