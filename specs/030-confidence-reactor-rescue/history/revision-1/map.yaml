  - controller
  - boards
  - hud
  - machinery
  - controls
  - bay_zones
  - lights
  overlap_with: []
  completion: Inside hot; HOLD routes core to cooling.
  reset: Cancel motion/feedback generations, park targets, restore all home poses/readings
    and enrollment. Preserve badges on replay; clear via manager on round reset.
- id: cool
  label: Cooling Bay
  pattern: shooting_gallery
  position:
  - 28
  - 0
  - 0
  size:
  - 28
  - 35
  - 9
  purpose: Operate cooling machinery, then retest.
  parameters:
    target_count: 2
    friendly_fire: false
  devices:
  - cool_targets
  - blaster
  - controller
  - boards
  - hud
  - machinery
  - controls
  - bay_zones
  - lights
  overlap_with: []
  completion: Both fresh measurements cool; core moves to release.
  reset: Cancel motion/feedback generations, park targets, restore all home poses/readings
    and enrollment. Preserve badges on replay; clear via manager on round reset.
- id: release
  label: Release
  pattern: shooting_gallery
  position:
  - 0
  - 0
  - 0
  size:
  - 28
  - 35
  - 9
  purpose: Release using verified evidence; earn Confidence Badge.
  parameters:
    target_count: 2
    friendly_fire: false
  devices:
  - release_targets
  - blaster
  - controller
  - boards
  - hud
  - machinery
  - controls
  - bay_zones
  - lights
  - completion_fx
  - progress
  - badge
  - replay_return
  overlap_with: []
  completion: Core enters cradle, guarded completion, replay or return.
  reset: Cancel motion/feedback generations, park targets, restore all home poses/readings
    and enrollment. Preserve badges on replay; clear via manager on round reset.
