stages:
- id: enroll
  zone: arrival
  purpose: Briefing and explicit Start/Join
  requires: []
  active_targets: []
  completion: Close five-second join window; no automatic enrollment.
- id: surface_scan
  zone: scan
  purpose: Select relevant surface heat test
  requires:
  - enroll
  active_targets:
  - surface
  - paint
  - casing
  completion: Sweep arm; outside cool, inside unknown; escort to check.
  success_target: surface
- id: independent_probe
  zone: check
  purpose: Obtain independent internal measurement
  requires:
  - surface_scan
  active_targets:
  - probe
  - copy
  - likes
  completion: Lower probe; inside HOT; visibly question 90% SAFE prediction.
  success_target: probe
- id: hold_core
  zone: check
  purpose: Respond to contradictory evidence
  requires:
  - independent_probe
  active_targets:
  - hold
  - send
  completion: Open routing shutter; escort to cooling; run-local section 0.
  success_target: hold
- id: coolant
  zone: cool
  purpose: Shoot moving coolant valve to operate safe machinery
  requires:
  - hold_core
  active_targets:
  - valve
  completion: Freeze or aim freely; lift/fan cool core; enable retest after completion.
  success_target: valve
- id: retest
  zone: cool
  purpose: Fresh tests after intervention
  requires:
  - coolant
  active_targets:
  - retest
  completion: Outside and inside both COOL; run-local section 1; escort to release.
  success_target: retest
- id: checked_release
  zone: release
  purpose: Choose checked release
  requires:
  - retest
  active_targets:
  - checked
  - skip
  completion: Open shutter, dock core, section 2; commit all indices for eligible
    participants; replay/return.
  success_target: checked
assumptions:
- id: site_and_weapon
  status: resolved
  detail: User explicitly confirmed existing Confidence Core footprint and Pulse Rifle;
    four actual floor actors, five gameplay beats.
  evidence: 'User reply 2026-09-28: Use the existing Confidence Core footprint and
    Pulse Rifle; evidence/editor-inventory.json'
- id: floor_repair
  status: resolved
  detail: Preserve overlapping debug-labeled support and bridge only 48 cm seam; do
    not expand or restore coplanar zero-width floor.
  evidence: Live floor bounds/transforms in evidence/editor-inventory.json; plan.md
- id: controller_scope
  status: resolved
  detail: Implement scoped controller after approval using existing shooting/motion
    basis; current energy_station does not support this design via configuration.
  evidence: Content/fn_shoreline_island_energy_station.verse; data_target.verse; prompt_blaster.verse;
    plan.md
- id: native_qualification
  status: resolved
  detail: Catalog candidates require placeability/cook qualification; eligible equivalents
    allowed only within authored roles and envelopes.
  evidence: asset-palette.md; prior disallowed-cat lesson in feature 022; plan.md
- id: shared_run
  status: resolved
  detail: One shared explicitly enrolled run with no speed penalty; only continuous
    participants commit all badge sections at finale.
  evidence: spec.md FR-06/08 and plan.md
- id: motion_schema
  status: resolved
  detail: V1 represents linear stages and anchors. Detailed motion, synchronized hits,
    reset and collision are implementation obligations, not established gameplay.
  evidence: design/MAP_SPEC.md; plan.md; AC-05..10
