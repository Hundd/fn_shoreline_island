  - hud
  - controller
  - membership
  - controls
  - replay_return
  - progress
  - badge
  - blaster
  overlap_with: []
  completion: Start closes five-second explicit Join window.
  reset: Cancel motion/feedback generations, park targets, restore all home poses/readings
    and enrollment. Preserve badges on replay; clear via manager on round reset.
