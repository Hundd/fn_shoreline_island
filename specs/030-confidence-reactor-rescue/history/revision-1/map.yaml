  title: Confidence Core - Reactor Rescue
  theme: coastal_reactor_workshop
  units: meters
  origin_cm:
  - -13000
  - -4100
  - 2400
  size:
  - 112
  - 35
  - 9
  learning_objective: Choose useful independent evidence, revise a confident wrong
    prediction, and verify results before acting.
  source_feature: specs/030-confidence-reactor-rescue/spec.md
  intent: propose_change
  min_path_width: 3
  position_tolerance: 0.25
player_flow:
- arrival
- scan
- check
- cool
- release
