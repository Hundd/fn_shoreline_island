- step: bind_logic
  stages:
  - id: enroll
    zone: arrival
    purpose: Briefing and explicit Start/Join
    requires: []
    active_targets: []
    completion: Close five-second join window; no automatic enrollment.
  - id: surface_scan
    zone: scan
    purpose: Select relevant surface heat test
    requires:
    - enroll
    active_targets:
    - surface
    - paint
    - casing
    completion: Sweep arm; outside cool, inside unknown; escort to check.
    success_target: surface
  - id: independent_probe
    zone: check
    purpose: Obtain independent internal measurement
    requires:
    - surface_scan
    active_targets:
    - probe
    - copy
    - likes
    completion: Lower probe; inside HOT; visibly question 90% SAFE prediction.
    success_target: probe
  - id: hold_core
    zone: check
    purpose: Respond to contradictory evidence
    requires:
    - independent_probe
    active_targets:
    - hold
    - send
    completion: Open routing shutter; escort to cooling; run-local section 0.
    success_target: hold
  - id: coolant
    zone: cool
    purpose: Shoot moving coolant valve to operate safe machinery
    requires:
    - hold_core
    active_targets:
    - valve
    completion: Freeze or aim freely; lift/fan cool core; enable retest after completion.
    success_target: valve
  - id: retest
    zone: cool
    purpose: Fresh tests after intervention
    requires:
    - coolant
    active_targets:
    - retest
    completion: Outside and inside both COOL; run-local section 1; escort to release.
    success_target: retest
  - id: checked_release
    zone: release
    purpose: Choose checked release
    requires:
    - retest
    active_targets:
    - checked
    - skip
    completion: Open shutter, dock core, section 2; commit all indices for eligible
      participants; replay/return.
    success_target: checked
