version: 1
map:
  id: prompt_lab
  title: Prompt Lab — current Data Blaster mission
  theme: ai_training
  units: meters
  origin_cm: [6000, -8500, 2410]
  size: [66, 62, 15]
  learning_objective: Useful details tell AI WHAT to choose and WHERE to take it.
  source_feature: specs/024-data-blaster-redesign/spec.md
  intent: document_existing
  min_path_width: 1.5
  position_tolerance: 0.25

# Envelopes are review groupings of the existing open platform, not new rooms.
player_flow: [arrival, knowledge, arena, reward]
zones:
  - id: arrival
    label: Arrival
    pattern: corridor
    position: [0, 30, 0]
    size: [20, 32, 15]
    purpose: Reach the arena from the existing hub approach without jumping.
    parameters: {width_m: 3, access: existing west ramp}
    devices: [entry, blaster]
    overlap_with: []
    completion: Existing entry volume enrolls the player.
    reset: Existing entry logic supports occupants at startup and re-entry.
  - id: knowledge
    label: Lesson overlay
    pattern: knowledge_room
    position: [30, 40, 0]
    size: [10, 10, 15]
    purpose: Teach useful detail before shooting; HUD lesson also reaches the approach.
    parameters:
      lesson: A prompt tells AI what you want. Useful details help it choose.
      duration_seconds: 7
      hud_copy: true
    devices: [board, feedback, controller]
    overlap_with: [arena]
    completion: Seven-second knowledge phase completes.
    reset: Replay replays the lesson and cancels stale delayed events.
  - id: arena
    label: Target arena
    pattern: target_sequence
    position: [20, 30, 0]
    size: [35, 32, 15]
    purpose: Select BLUE, add LARGE, select LARGE BLUE, acquire it moving, then choose REACTOR.
    parameters: {target_count: 9, sequence: [0, 3, 5, 5, 6], shared_state: true}
    devices: [controller, targets, hit_surfaces, energy, blaster]
    overlap_with: [knowledge]
    completion: Five correct hits start the existing Pix delivery finale.
    reset: Shared replay resets stages and movement; last departure resets; earned badges and DATA survive replay.
  - id: reward
    label: Module / return
    pattern: reward_room
    position: [55, 0, 0]
    size: [11, 62, 15]
    purpose: Watch power reach the Prompt Module, receive the badge, and return toward the hub.
    parameters: {badge: Prompt Badge, return_mode: existing grind rail}
    devices: [progress, replay, controller, return_rail]
    overlap_with: []
    completion: Finale completes and the existing badge guard awards eligible participants.
    reset: Replay preserves badge and DATA, resets spectacle and disables the return rail until completion.

connections:
  - from: arrival
    to: knowledge
    mode: walk
    width: 3
    points: [[15, 42, 0], [35, 46, 0]]
    gate: always
  - from: knowledge
    to: arena
    mode: walk
    width: 3
    points: [[35, 46, 0], [24, 40, 0]]
    gate: intro
  - from: arena
    to: reward
    mode: walk
    width: 3
    points: [[24, 40, 0], [55, 38, 0], [64, 23, 0]]
    gate: destination

markers:
  - {id: arrival_point, kind: spawn, zone: arrival, label: 'Arrival from hub (no new spawn pad)', position: [15, 33, 1.9], source: 'editor-transforms.json entry_zone; marker denotes arrival only'}
  - {id: blaster_inventory, kind: weapon, zone: arrival, label: 'Data Blaster retained from hub', position: [12, 37, 0], source: 'Conceptual inventory cue; fn_shoreline_island_data_blaster.verse; not a placed weapon'}
  - {id: lesson_board, kind: knowledge, zone: knowledge, label: 'AI Knowledge board / HUD', position: [35, 46, 11.9], source: 'editor-transforms.json board'}
  - {id: blue, kind: target, zone: arena, label: BLUE, target_id: 0, position: [26.5, 55, 3.65], source: 'editor-transforms.json target_0'}
  - {id: red, kind: target, zone: arena, label: RED, target_id: 1, position: [26.5, 47, 3.65], source: 'editor-transforms.json target_1'}
  - {id: green, kind: target, zone: arena, label: GREEN, target_id: 2, position: [26.5, 39, 3.65], source: 'editor-transforms.json target_2'}
  - {id: large_detail, kind: target, zone: arena, label: LARGE detail, target_id: 3, position: [38.5, 35, 3.65], source: 'editor-transforms.json target_3'}
  - {id: small_blue, kind: target, zone: arena, label: SMALL BLUE, target_id: 4, position: [40, 46, 3.65], source: 'editor-transforms.json target_4'}
  - {id: large_blue, kind: target, zone: arena, label: LARGE BLUE / moving acquisition, target_id: 5, position: [39.5, 55, 3.65], source: 'editor-transforms.json target_5; motion envelope not yet mapped'}
  - {id: reactor, kind: target, zone: arena, label: REACTOR, target_id: 6, position: [49.5, 55, 3.65], source: 'editor-transforms.json target_6'}
  - {id: scanner, kind: target, zone: arena, label: SCANNER, target_id: 7, position: [49.5, 43, 3.65], source: 'editor-transforms.json target_7'}
  - {id: storage, kind: target, zone: arena, label: STORAGE, target_id: 8, position: [49.5, 34, 3.65], source: 'editor-transforms.json target_8'}
  - {id: module, kind: reward, zone: reward, label: Prompt Module / badge finale, position: [64, 23, 2.7], source: 'editor-transforms.json prompt_module'}
  - {id: return_exit, kind: exit, zone: reward, label: Return rail start — boarding unresolved, position: [63, 20, 3.4], source: 'editor-transforms.json return_ride; endpoint not surveyed'}

# Counts describe the selected adapter contract, not a complete census of props/VFX.
# Shared devices appear once and are referenced by multiple zones.
devices:
  - id: entry
    class: mutator_zone_device
    count: 1
    source: specs/024-data-blaster-redesign/evidence/prompt-blaster-actors.json#entry
    settings: {action: reuse, purpose: enroll participants, tiles: [6, 12, 3]}
  - id: controller
    class: fn_shoreline_island_prompt_blaster
    count: 1
    source: Content/fn_shoreline_island_prompt_blaster.verse
    settings: {action: reuse, configured: true, targets: [0, 1, 2, 3, 4, 5, 6, 7, 8], progress: progress, data_energy: energy, entry_zone: entry}
  - id: targets
    class: fn_shoreline_island_data_target
    count: 9
    source: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json#targets
    settings: {action: reuse, reward_value: 1, objective_target_ids: [3]}
  - id: hit_surfaces
    class: trigger_device
    count: 9
    source: specs/024-data-blaster-redesign/evidence/prompt-blaster-actors.json#surfaces
    settings: {action: reuse, interaction: damage_only, attribution: actual_shooting_agent}
  - id: energy
    class: fn_shoreline_island_data_energy
    count: 1
    source: Content/fn_shoreline_island_data_energy.verse
    settings: {action: reuse, replay_retains_data: true, round_clears_data: true}
  - id: blaster
    class: fn_shoreline_island_data_blaster
    count: 1
    source: Content/fn_shoreline_island_data_blaster.verse
    settings: {action: reuse, scope: shared_hub, item: existing_allowed_rare_pulse_rifle}
  - id: board
    class: billboard_device
    count: 1
    source: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json#controller.board
    settings: {action: reuse, knowledge_seconds: 7}
  - id: feedback
    class: hud_message_device
    count: 1
    source: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json#controller.feedback
    settings: {action: reuse, scope: participants}
  - id: progress
    class: byte_island_game_manager
    count: 1
    source: Content/byte_island_game_manager.verse
    settings: {action: reuse, badge: existing_prompt_badge_guard}
  - id: replay
    class: button_device
    count: 1
    source: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json#controller.replay
    settings: {action: reuse, label: Replay Prompt Lab}
  - id: return_rail
    class: grind_rail_device
    count: 1
    source: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json#controller.return_ride
    settings: {action: reuse, enable_after: finale}

stages:
  - {id: enter, zone: arrival, purpose: Enroll player with existing loadout, requires: [], active_targets: [], completion: Player enters existing volume}
  - {id: intro, zone: knowledge, purpose: Explain useful prompt details, requires: [enter], active_targets: [], completion: Existing seven-second Knowledge phase finishes}
  - {id: color, zone: arena, purpose: Choose WHAT using color, requires: [intro], active_targets: [blue, red, green], success_target: blue, completion: BLUE hit advances; wrong hits retry}
  - {id: detail, zone: arena, purpose: Resolve ambiguity by adding LARGE, requires: [color], active_targets: [large_detail], success_target: large_detail, completion: LARGE objective hit advances}
  - {id: select_large, zone: arena, purpose: Apply the useful detail, requires: [detail], active_targets: [red, small_blue, large_blue], success_target: large_blue, completion: LARGE BLUE hit then two-second instruction handoff}
  - {id: acquire, zone: arena, purpose: Acquire the slowly moving core, requires: [select_large], active_targets: [large_blue], success_target: large_blue, completion: Hit freezes both core and hit surface}
  - {id: destination, zone: arena, purpose: Choose WHERE the core belongs, requires: [acquire], active_targets: [reactor, scanner, storage], success_target: reactor, completion: REACTOR hit starts existing delivery}
  - {id: finale, zone: reward, purpose: Watch result and earn Prompt Badge, requires: [destination], active_targets: [], completion: Existing Pix delivery powers module; badge awarded once; return rail enabled}

assumptions:
  - id: review_envelopes
    detail: Zone boundaries and path lines are interpretive review envelopes, not surveyed walls or movement instructions. Approve their use before any layout change.
    status: open
    evidence: Floor bounds recorded in feature 024 prompt-entry-ramps-2026-09-27.md; marker transforms measured in this feature.
  - id: access_and_return
    detail: Return rail boarding/hub arrival remains unproven; external ramps and complete rail spline are not represented in this 2D envelope.
    status: open
    evidence: specs/024-data-blaster-redesign/evidence/return-boarding-comparison-2026-09-27.md
  - id: adapter_scope
    detail: Prompt controller hardcodes stages and target ordering. Arbitrary target_sequence parameters are not implemented; preserve the existing five-hit sequence.
    status: open
    evidence: Content/fn_shoreline_island_prompt_blaster.verse on_hit and start_destination
  - id: complete_inventory
    detail: Device table covers gameplay anchors, not all VFX, audio, props, cables, moving bounds or savedActor bindings. Resolve a full scene delta before implementation.
    status: open
    evidence: specs/024-data-blaster-redesign/evidence/handoff-binding-readback-2026-09-27.json
  - id: gameplay_acceptance
    detail: Cooperative lifecycle, return ride and readability/enjoyment acceptance remain open; successful solo hits do not close the prototype gate.
    status: open
    evidence: specs/024-data-blaster-redesign/prompt-playtest.md and latest feature 024 evidence
