- step: bind_logic
  stages:
  - id: enter
    zone: arrival
    purpose: Enroll player with existing loadout
    requires: []
    active_targets: []
    completion: Player enters existing volume
  - id: intro
    zone: knowledge
    purpose: Explain useful prompt details
    requires:
    - enter
    active_targets: []
    completion: Existing seven-second Knowledge phase finishes
  - id: color
    zone: arena
    purpose: Choose WHAT using color
    requires:
    - intro
    active_targets:
    - blue
    - red
    - green
    success_target: blue
    completion: BLUE hit advances; wrong hits retry
  - id: detail
    zone: arena
    purpose: Resolve ambiguity by adding LARGE
    requires:
    - color
    active_targets:
    - large_detail
    success_target: large_detail
    completion: LARGE objective hit advances
  - id: select_large
    zone: arena
    purpose: Apply the useful detail
    requires:
    - detail
    active_targets:
    - red
    - small_blue
    - large_blue
    success_target: large_blue
    completion: LARGE BLUE hit then two-second instruction handoff
  - id: acquire
    zone: arena
    purpose: Acquire the slowly moving core
    requires:
    - select_large
    active_targets:
    - large_blue
    success_target: large_blue
    completion: Hit freezes both core and hit surface
  - id: destination
    zone: arena
    purpose: Choose WHERE the core belongs
    requires:
    - acquire
    active_targets:
    - reactor
    - scanner
    - storage
    success_target: reactor
    completion: REACTOR hit starts existing delivery
  - id: finale
    zone: reward
    purpose: Watch result and earn Prompt Badge
    requires:
    - destination
    active_targets: []
    completion: Existing Pix delivery powers module; badge awarded once; return rail
      enabled
  connections:
  - from: arrival
    to: knowledge
    mode: walk
    width: 3
    points:
    - - 15
      - 42
      - 0
    - - 35
      - 46
      - 0
    gate: always
  - from: knowledge
    to: arena
    mode: walk
    width: 3
    points:
    - - 35
      - 46
      - 0
    - - 24
      - 40
      - 0
    gate: intro
  - from: arena
    to: reward
    mode: walk
    width: 3
    points:
    - - 24
      - 40
      - 0
    - - 55
      - 38
      - 0
    - - 64
      - 23
      - 0
    gate: destination
  verify: Read back ordered target arrays, shared systems and required entry/exit
    gates.
- step: verify_gameplay
  checks:
  - Verse build if changed
  - UEFN validation/cook
  - spawn and approach
  - objective sequence and wrong choices
  - replay/round reset
  - solo
  - multiplayer shared state
  - learning clarity and enjoyment
  - stop game and confirm state
  verify: Record expected/actual, deviations and evidence; transport success is not
    acceptance.
