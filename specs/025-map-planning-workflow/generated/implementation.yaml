version: 1
map_id: prompt_lab
spec_digest: 3a81679b6520c8b51e161c74c534437e68e27a3339f7f641a31f412410a9561e
patterns_digest: 18ddda2fcef5edbb7f1d19fbe85cbb29a1821b863bf5a8cdf1a23218d5d8d981
status: draft_requires_explicit_human_approval
executable: false
blockers:
- 'review_envelopes: Zone boundaries and path lines are interpretive review envelopes,
  not surveyed walls or movement instructions. Approve their use before any layout
  change.'
- 'access_and_return: Return rail boarding/hub arrival remains unproven; external
  ramps and complete rail spline are not represented in this 2D envelope.'
- 'adapter_scope: Prompt controller hardcodes stages and target ordering. Arbitrary
  target_sequence parameters are not implemented; preserve the existing five-hit sequence.'
- 'complete_inventory: Device table covers gameplay anchors, not all VFX, audio, props,
  cables, moving bounds or savedActor bindings. Resolve a full scene delta before
  implementation.'
- 'gameplay_acceptance: Cooperative lifecycle, return ride and readability/enjoyment
  acceptance remain open; successful solo hits do not close the prototype gate.'
position_tolerance_m: 0.25
implementation:
- step: inspect_existing
  map: prompt_lab
  verify: Confirm project/world, actor identities, full transforms, bindings and checkpoint
    before mutations.
